# A downstream workflow as docs/distribution/README.md (6.1, 6.3) plans it:
# read-only token, one environment per channel, reads the published
# release and writes only to other repositories.
name: Distribute

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        type: string
        required: true

permissions:
  contents: read

jobs:
  distribute-homebrew:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: distribute-homebrew
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify the release input
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isImmutable
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p SHA256SUMS -p release-meta.json
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq .id
          gh api -X GET "repos/$GITHUB_REPOSITORY/releases" -f per_page=10 --jq '.[].tag_name'
          curl -fsSL "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/release-meta.json" -o meta.json
      - name: Cask update as a pull request to the tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          git push fork HEAD:deckpilot-update
          gh pr create --repo knittingcode/homebrew-tap --title "deckpilot $TAG" --body "update"

  distribute-apt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: distribute-apt
    # Narrower than the workflow, never wider.
    permissions:
      contents: none
    steps:
      - run: echo "dry run"
