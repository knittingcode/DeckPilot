# expect: writes the release (curl
name: Distribute

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  distribute-homebrew:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: distribute-homebrew
    steps:
      - name: Update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS --request PATCH -d "{}" "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/$ID"
