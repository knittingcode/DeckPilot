# expect: writes the release (gh release edit
name: Distribute

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  distribute-homebrew:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: distribute-homebrew
    steps:
      - name: Update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "$TAG" --notes "Homebrew: updated"
