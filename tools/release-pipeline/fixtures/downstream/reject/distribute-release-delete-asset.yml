# expect: writes the release (gh release delete-asset
name: Distribute

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  distribute-homebrew:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: distribute-homebrew
    steps:
      - name: Update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete-asset "$TAG" DeckPilot_0.7.0_amd64_apt.deb --yes
