# expect: writes the release or a tag (github-script)
name: Distribute

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  distribute-homebrew:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: distribute-homebrew
    steps:
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        with:
          script: |
            await github.rest.repos.updateRelease({owner: context.repo.owner, repo: context.repo.repo, release_id: 1, body: "x"})
