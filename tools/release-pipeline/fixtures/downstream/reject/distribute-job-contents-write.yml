# expect: downstream job distribute-homebrew may not have contents: write (contents: write)
name: Distribute

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  distribute-homebrew:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: distribute-homebrew
    permissions:
      contents: write
    steps:
      - name: Update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo hello
