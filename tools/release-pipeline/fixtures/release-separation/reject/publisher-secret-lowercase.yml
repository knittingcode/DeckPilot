# expect: uses a registry secret
# Secret names are case-insensitive: secrets.deckpilot_publisher_key is the
# publisher key.
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - env:
          KEY: ${{ secrets.deckpilot_publisher_key }}
        run: echo "$KEY" > key
