# expect: gives the application signing secrets to registry or plugin signing
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  keys:
    runs-on: ubuntu-latest
    steps:
      - env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: target/release/deckpilot-registry keyset sign --key "$KEY"
