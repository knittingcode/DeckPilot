# expect: gives the application signing secrets to registry or plugin signing
# The updater key under a lowercase name is still the updater key.
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - env:
          KEY: ${{ secrets.tauri_signing_private_key }}
        run: target/release/deckpilot-registry sign-index --key key
