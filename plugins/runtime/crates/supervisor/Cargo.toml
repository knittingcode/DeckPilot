[package]
name = "deckpilot-plugin-supervisor"
description = "Agent-side supervisor for DeckPilot plugin hosts: spawn, handshake, timeouts, restart policy, broker relay"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
deckpilot-plugin-abi.workspace = true
deckpilot-plugin-broker.workspace = true
serde_json.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Isolation",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
] }

[dev-dependencies]
serde_json.workspace = true

# Scripted fake hosts: the test binary re-executes itself as a misbehaving
# host, so it needs its own main (no libtest output on stdout).
[[test]]
name = "fake_host"
path = "tests/fake_host.rs"
harness = false

[lints]
workspace = true
