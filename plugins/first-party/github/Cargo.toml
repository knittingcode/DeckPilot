# deckpilot.github: the first-party GitHub plugin, the replacement of the
# built-in `github` module (docs/marketplace/module-migration.md §6, P8).
# Bundled with class `migration` (plugins/first-party/bundled.json); not
# routed until the cut-over (P9).
#
# A member of the plugins/runtime workspace (shared Cargo.lock and the
# `guest` profile), built for wasm32-unknown-unknown; the rlib crate type
# lets its native unit tests run with plain `cargo test`.
[package]
name = "deckpilot-github"
description = "DeckPilot's first-party GitHub plugin: read-only pull requests, reviews and checks"
version = "0.2.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
publish = false
workspace = "../../runtime"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
deckpilot-plugin-sdk.workspace = true
# URLs without a URL parser (the `url` crate's IDNA tables would more than
# double the module), shared with the other plugins for a server the user
# enters: api.github.com or the GitHub Enterprise API in `apiUrl`.
deckpilot-first-party-support = { path = "../support" }
serde_json.workspace = true

[dev-dependencies]
# `guest::features`, to check what `dp_features` reports.
deckpilot-plugin-abi.workspace = true
jsonschema.workspace = true

[lints]
workspace = true
