[package]
name = "deckpilot-plugin-bundled"
description = "Experimental: first-party plugins shipped inside the application bundle: the pins format, the pins compiled into the agent, and verification."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
build = "build.rs"

[dependencies]
deckpilot-plugin-manifest.workspace = true
deckpilot-plugin-package.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

# The app bundle's code seal (SecStaticCode), checked in addition to the
# pins on macOS. Both are already in the agent through the keychain store
# and the TLS stack; no new crate.
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
security-framework = "3"

[build-dependencies]
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
