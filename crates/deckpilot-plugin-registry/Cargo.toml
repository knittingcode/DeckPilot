[package]
name = "deckpilot-plugin-registry"
description = "Experimental: client-side verification of the signed DeckPilot plugin registry. Not used by DeckPilot yet."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Reused unchanged: the app updater's minisign verifier (Tauri base64 format).
deckpilot-update.workspace = true
deckpilot-plugin-manifest.workspace = true
deckpilot-plugin-package.workspace = true
base64.workspace = true
chrono.workspace = true
# Only to read the trusted comment of a signature (verification itself goes
# through deckpilot-update).
minisign-verify.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true

[dev-dependencies]
# Signs test documents with throwaway keys generated per test.
minisign = "0.10"
# Validates the documents the tests sign against the bundled #191 schemas.
# Without default features: no HTTP or file reference resolution.
jsonschema = { version = "0.61", default-features = false }

[lints]
workspace = true
