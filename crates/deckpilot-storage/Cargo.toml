[package]
name = "deckpilot-storage"
description = "Local configuration storage for DeckPilot"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
deckpilot-core.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[lints]
workspace = true

[features]
# Build against SQLCipher instead of plain SQLite so that `Encryption::Key`
# can be used. Requires a C toolchain; OpenSSL is vendored.
sqlcipher = ["rusqlite/bundled-sqlcipher-vendored-openssl"]

[dev-dependencies]
deckpilot-device.workspace = true
