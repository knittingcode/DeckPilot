[package]
name = "deckpilot-core"
description = "Domain model and execution engine for DeckPilot"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
base64.workspace = true
deckpilot-device.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true

[features]
# Test only, never in a release build: `ModuleRegistry::with_aliases`, so
# agent tests can route a fixture alias table (the shipped
# `ACTION_ALIASES` in its place).
test-hooks = []

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["process", "std"] }

[lints]
workspace = true
