[package]
name = "deckpilot-update"
description = "Update manifest validation, signature verification and update policy for DeckPilot"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
base64.workspace = true
# The build's distribution record, the input of `provider` (pure data, no
# dependencies of its own).
deckpilot-distribution.workspace = true
minisign-verify.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# Artifact URLs must read the same to a URL parser (no `%2e%2e` segments).
url.workspace = true

[dev-dependencies]
minisign = "0.10"
# Reads docs/distribution/targets.toml in tests/targets_matrix.rs; already
# in the lock file (through tauri-build).
toml = "1"

[lints]
workspace = true
