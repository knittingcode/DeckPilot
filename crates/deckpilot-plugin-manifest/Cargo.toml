[package]
name = "deckpilot-plugin-manifest"
description = "Experimental: typed model and validation of the DeckPilot plugin manifest (manifestVersion 1). Not used by DeckPilot yet."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
url.workspace = true

[dev-dependencies]
# Validates the bundled JSON Schema against the same fixtures as the Rust
# model, so the two cannot drift. Without default features: no HTTP or file
# reference resolution (the schema is self-contained).
jsonschema = { version = "0.61", default-features = false }

[lints]
workspace = true
