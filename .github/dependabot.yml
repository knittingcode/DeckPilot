# Version updates, kept conservative: weekly, minor and patch updates grouped
# into one pull request per ecosystem, majors one by one, few open pull
# requests at a time, and a cooldown so that a release is a week old before
# it is proposed. Security updates (a repository setting) are not limited by
# open-pull-requests-limit or the cooldown.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    # Not rebased on every push to main: with up to 15 open updates that
    # started a burst of full CI runs per merge (each is brought up to date
    # once, when it is merged).
    rebase-strategy: disabled
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore(deps)
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]

  # The plugin runtime (plugins/runtime) is a separate Cargo workspace with
  # its own lock file.
  - package-ecosystem: cargo
    directory: /plugins/runtime
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    # Not rebased on every push to main: with up to 15 open updates that
    # started a burst of full CI runs per merge (each is brought up to date
    # once, when it is merged).
    rebase-strategy: disabled
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore(deps)
    groups:
      plugin-runtime-cargo-minor-and-patch:
        update-types: [minor, patch]

  # The pnpm workspace (apps/*) has a single lockfile at the root.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    # Not rebased on every push to main: with up to 15 open updates that
    # started a burst of full CI runs per merge (each is brought up to date
    # once, when it is merged).
    rebase-strategy: disabled
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore(deps)
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  # The website is not part of the pnpm workspace: npm, with its own
  # package-lock.json.
  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    # Not rebased on every push to main: with up to 15 open updates that
    # started a burst of full CI runs per merge (each is brought up to date
    # once, when it is merged).
    rebase-strategy: disabled
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore(deps)
    groups:
      website-npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    # Not rebased on every push to main: with up to 15 open updates that
    # started a burst of full CI runs per merge (each is brought up to date
    # once, when it is merged).
    rebase-strategy: disabled
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci(deps)
    groups:
      github-actions:
        patterns: ["*"]
