name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # A hung test fails the job instead of holding it for the default 6 hours.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: tools/ci/install-linux-deps.sh
      # Installs the toolchain pinned in rust-toolchain.toml.
      - name: Install Rust toolchain
        run: rustup toolchain install && rustc --version && cargo clippy --version
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The desktop crate embeds the built frontend at compile time.
      - run: pnpm --filter @deckpilot/desktop build
      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Check that app, agent and frontend versions match
        if: runner.os == 'Linux'
        run: cargo run --locked -p deckpilot-dev -- check-versions
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
        timeout-minutes: 25
      # The guided hardware test, run against a simulated MK.2 with the real
      # agent: checks the procedure (not hardware).
      - name: Hardware test procedure (simulated device)
        if: runner.os == 'Linux'
        run: cargo run --locked -p deckpilot-dev -- hardware-test --mock --dir "$RUNNER_TEMP/hardware-test"
      # The agent embeds an Info.plist so that code signing uses a fixed
      # identifier; its Keychain access across updates depends on it.
      - name: The agent keeps a fixed code signing identifier
        if: runner.os == 'macOS'
        run: |
          cp target/debug/deckpilot-agent "$RUNNER_TEMP/deckpilot-agent"
          codesign --force --sign - --options runtime "$RUNNER_TEMP/deckpilot-agent"
          codesign --display --verbose=2 "$RUNNER_TEMP/deckpilot-agent" 2>&1 \
            | grep -x "Identifier=io.github.knittingcode.deckpilot.agent"

  sqlcipher:
    name: Storage with SQLCipher
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Installs the toolchain pinned in rust-toolchain.toml.
      - name: Install Rust toolchain
        run: rustup toolchain install && rustc --version && cargo clippy --version
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p deckpilot-storage --features sqlcipher --locked

  # The real credential store of each platform, under throwaway service
  # names that the test creates and deletes (never DeckPilot's own).
  keystore:
    name: Credential store (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      DECKPILOT_TEST_SYSTEM_KEYSTORE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@v2
      - name: Secret Service (GNOME Keyring)
        if: runner.os == 'Linux'
        run: |
          timeout 600 sudo apt-get update -o Acquire::ForceIPv4=true
          timeout 600 sudo apt-get install -y --no-install-recommends -o Acquire::ForceIPv4=true gnome-keyring dbus
      - name: Test (Linux, in a D-Bus session with an unlocked keyring)
        if: runner.os == 'Linux'
        run: |
          dbus-run-session -- sh -c '
            echo "ci-keyring" | gnome-keyring-daemon --daemonize --unlock --components=secrets >/dev/null &&
            cargo test -p deckpilot-keystore --locked -- --nocapture'
      - name: Test
        if: runner.os != 'Linux'
        run: cargo test -p deckpilot-keystore --locked -- --nocapture

  # The release assembles latest.json from per-build fragments; release.yml
  # only runs on a tag, so the assembly is tested here with fake packages
  # signed by a throwaway key. Nothing is published.
  release-manifest:
    name: Release manifest assembly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system dependencies
        run: tools/ci/install-linux-deps.sh
      - name: Install Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-manifest
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Release scripts pass shellcheck
        run: shellcheck tools/ci/*.sh
      - name: Assemble and verify latest.json from fixture builds
        run: tools/ci/test-latest-json.sh "$RUNNER_TEMP/latest-json-test"

  # Builds the Linux .deb with the release configuration (bundled agent,
  # udev rule) to catch packaging mistakes before a release. Nothing is
  # signed or published.
  package-linux:
    name: Package check (Linux .deb)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system dependencies
        run: tools/ci/install-linux-deps.sh
      - name: Install Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: package-linux
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build and stage the agent
        run: |
          cargo build --release --locked -p deckpilot-agent
          mkdir -p apps/desktop/src-tauri/binaries
          cp target/release/deckpilot-agent "apps/desktop/src-tauri/binaries/deckpilot-agent-$(rustc -vV | sed -n 's/^host: //p')"
      - name: Build the .deb and .rpm
        run: >
          pnpm --filter @deckpilot/desktop tauri build --bundles deb,rpm
          --config src-tauri/tauri.release.conf.json
          --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: The package contains the app, the agent and the udev rule
        run: |
          deb=$(find target/release/bundle/deb -name '*.deb' | head -n 1)
          contents=$(dpkg-deb --contents "$deb")
          echo "$contents"
          # dpkg-deb lists paths with or without a leading "./".
          for path in usr/bin/deckpilot-agent usr/lib/udev/rules.d/70-deckpilot-streamdeck.rules 'usr/share/applications/.*\.desktop'; do
            echo "$contents" | grep -q -E " (\./)?$path\$" || { echo "::error::$deb lacks $path"; exit 1; }
          done
          echo "$deb contains the app, the agent and the udev rule"
          rpm=$(find target/release/bundle/rpm -name '*.rpm' | head -n 1)
          files=$(rpm -qlp "$rpm")
          echo "$files"
          for path in /usr/bin/deckpilot-agent /usr/lib/udev/rules.d/70-deckpilot-streamdeck.rules; do
            echo "$files" | grep -q -x -F "$path" || { echo "::error::$rpm lacks $path"; exit 1; }
          done
          echo "$rpm contains the app, the agent and the udev rule"

  # Builds the Windows installers with the release configuration, the way
  # the release workflow does (agent built in a bash step with Strawberry
  # Perl for OpenSSL), and checks that both contain the agent. Unsigned.
  package-windows:
    name: Package check (Windows installers)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        shell: bash
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: package-windows
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Use Strawberry Perl for OpenSSL
        shell: pwsh
        run: |
          "OPENSSL_SRC_PERL=C:\Strawberry\perl\bin\perl.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build and stage the agent
        shell: bash
        run: |
          cargo build --release --locked -p deckpilot-agent
          mkdir -p apps/desktop/src-tauri/binaries
          cp target/release/deckpilot-agent.exe "apps/desktop/src-tauri/binaries/deckpilot-agent-$(rustc -vV | sed -n 's/^host: //p').exe"
      - name: Build the installers
        shell: bash
        run: >
          pnpm --filter @deckpilot/desktop tauri build --bundles nsis,msi
          --config src-tauri/tauri.release.conf.json
          --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Extract the installers
        shell: pwsh
        run: |
          $nsis = Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1
          & 7z x -y "-o$env:RUNNER_TEMP\nsis" $nsis.FullName | Out-Null
          $msi = Get-ChildItem target/release/bundle/msi/*.msi | Select-Object -First 1
          $process = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @("/a", "`"$($msi.FullName)`"", "/qn", "TARGETDIR=`"$env:RUNNER_TEMP\msi`"")
          if ($process.ExitCode -ne 0) { Write-Error "administrative MSI extraction failed: $($process.ExitCode)"; exit 1 }
      - name: Both installers contain the app and the agent
        shell: bash
        run: |
          for kind in nsis msi; do
            files=$(find "$RUNNER_TEMP/$kind" -type f -iname '*.exe' | sed 's#.*/##' | sort -u)
            echo "$kind: $(echo $files)"
            echo "$files" | grep -q -i -x "deckpilot-agent.exe" || { echo "::error::the $kind installer lacks deckpilot-agent.exe"; exit 1; }
            [ "$(echo "$files" | grep -v -i -x "deckpilot-agent.exe" | grep -v -i "uninstall" | grep -c .)" -ge 1 ] \
              || { echo "::error::the $kind installer lacks the application executable"; exit 1; }
          done
