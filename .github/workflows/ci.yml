name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Pull requests: a new push cancels the obsolete run of the same pull
# request. main: every pushed commit gets its own group, so post-merge runs
# are never cancelled or replaced; they queue for runners instead.
# (Only main and pull requests trigger this workflow, so a commit never runs
# twice for push and pull_request.)
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.ref, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Line tables keep file and line numbers in backtraces at a fraction of
  # full debug info: smaller caches, faster linking (notably on Windows).
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  # Only main saves Rust caches. Pull requests restore main's: their own
  # entries (one per branch, ~0.8 GB on Windows) evicted main's from the
  # 10 GB repository cache and turned later restores into partial matches.
  RUST_CACHE_SAVE: ${{ github.ref == 'refs/heads/main' }}

jobs:
  # Which optional jobs a pull request needs (tools/ci/changed-paths.sh).
  # Required checks never depend on it; on pushes to main every optional
  # job runs. A job whose paths did not change reports as skipped. The
  # package checks are in packaging.yml.
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      keystore: ${{ steps.paths.outputs.keystore }}
      release_manifest: ${{ steps.paths.outputs.release_manifest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The pull request's merge commit and its first parent, the base.
          fetch-depth: 2
      - name: The path rules work
        run: tools/ci/test-changed-paths.sh
      - id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: tools/ci/changed-paths.sh

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # A hung test fails the job instead of holding it for the default 6 hours.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: tools/ci/install-linux-deps.sh
      # Installs the toolchain pinned in rust-toolchain.toml.
      - name: Install Rust toolchain
        run: rustup toolchain install && rustc --version && cargo clippy --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ env.RUST_CACHE_SAVE == 'true' }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The desktop crate embeds the built frontend at compile time.
      - run: pnpm --filter @deckpilot/desktop build
      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Check that app, agent and frontend versions match
        if: runner.os == 'Linux'
        run: cargo run --locked -p deckpilot-dev -- check-versions
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
        timeout-minutes: 25
      # The guided hardware test, run against a simulated MK.2 with the real
      # agent: checks the procedure (not hardware).
      - name: Hardware test procedure (simulated device)
        if: runner.os == 'Linux'
        run: cargo run --locked -p deckpilot-dev -- hardware-test --mock --dir "$RUNNER_TEMP/hardware-test"
      # The agent embeds an Info.plist so that code signing uses a fixed
      # identifier; its Keychain access across updates depends on it.
      - name: The agent keeps a fixed code signing identifier
        if: runner.os == 'macOS'
        run: |
          cp target/debug/deckpilot-agent "$RUNNER_TEMP/deckpilot-agent"
          codesign --force --sign - --options runtime "$RUNNER_TEMP/deckpilot-agent"
          codesign --display --verbose=2 "$RUNNER_TEMP/deckpilot-agent" 2>&1 \
            | grep -x "Identifier=io.github.knittingcode.deckpilot.agent"

  sqlcipher:
    name: Storage with SQLCipher
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Installs the toolchain pinned in rust-toolchain.toml.
      - name: Install Rust toolchain
        run: rustup toolchain install && rustc --version && cargo clippy --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ env.RUST_CACHE_SAVE == 'true' }}
      - run: cargo test -p deckpilot-storage --features sqlcipher --locked

  # The real credential store of each platform, under throwaway service
  # names that the test creates and deletes (never DeckPilot's own).
  keystore:
    name: Credential store (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.keystore == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      DECKPILOT_TEST_SYSTEM_KEYSTORE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Rust toolchain
        run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ env.RUST_CACHE_SAVE == 'true' }}
      - name: Secret Service (GNOME Keyring)
        if: runner.os == 'Linux'
        run: |
          timeout 600 sudo apt-get update -o Acquire::ForceIPv4=true
          timeout 600 sudo apt-get install -y --no-install-recommends -o Acquire::ForceIPv4=true gnome-keyring dbus
      # In a D-Bus session with an unlocked keyring that answers before the
      # tests start; see tools/ci/with-keyring.sh.
      - name: Test (Linux, in a D-Bus session with an unlocked keyring)
        if: runner.os == 'Linux'
        run: tools/ci/with-keyring.sh cargo test -p deckpilot-keystore --locked -- --nocapture
      - name: Test
        if: runner.os != 'Linux'
        run: cargo test -p deckpilot-keystore --locked -- --nocapture

  # The release assembles latest.json from per-build fragments; release.yml
  # only runs on a tag, so the assembly is tested here with fake packages
  # signed by a throwaway key. Nothing is published.
  release-manifest:
    name: Release manifest assembly
    needs: changes
    if: needs.changes.outputs.release_manifest == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Linux system dependencies
        run: tools/ci/install-linux-deps.sh
      - name: Install Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-manifest
          save-if: ${{ env.RUST_CACHE_SAVE == 'true' }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Release scripts pass shellcheck
        run: shellcheck tools/ci/*.sh
      - name: Assemble and verify latest.json from fixture builds
        run: tools/ci/test-latest-json.sh "$RUNNER_TEMP/latest-json-test"
      # Pre-release handling of the Packaging workflow (no .rpm, MSI
      # version mapping), on fake packages.
      - name: Package checks for pre-release versions
        run: tools/ci/test-check-packages.sh "$RUNNER_TEMP/check-packages-test"
