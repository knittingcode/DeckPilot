name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A merge queue group (gh-readonly-queue/main/...): the required checks
  # must report for it, under the same names. Inert until the queue is on.
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

# Pull requests: a new push cancels the obsolete run of the same pull
# request. main: every pushed commit gets its own group, so post-merge runs
# are never cancelled or replaced; they queue for runners instead.
# Merge queue groups: one group per queue ref and commit, never cancelled
# here (the queue drops groups it no longer needs). (Only main, pull requests
# and merge groups trigger this workflow, so a commit never runs twice for
# push and pull_request.)
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.ref, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Line tables keep file and line numbers in backtraces at a fraction of
  # full debug info: smaller caches, faster linking (notably on Windows).
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  # Only main saves Rust caches. Pull requests restore main's: their own
  # entries (one per branch, ~0.8 GB on Windows) evicted main's from the
  # 10 GB repository cache and turned later restores into partial matches.
  # Not named RUST_*: Swatinem/rust-cache hashes every RUST*, CARGO*, CC*,
  # CFLAGS*, CXX* and CMAKE* variable into its cache key, so a variable that
  # differs between main and pull requests gave them different keys and no
  # pull request ever restored main's cache.
  SAVE_RUST_CACHE: ${{ github.ref == 'refs/heads/main' }}

jobs:
  # Which optional jobs a pull request needs (tools/ci/changed-paths.sh).
  # Required checks never depend on it; on pushes to main every optional
  # job runs. A job whose paths did not change reports as skipped. The
  # package checks are in packaging.yml.
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      keystore: ${{ steps.paths.outputs.keystore }}
      release_manifest: ${{ steps.paths.outputs.release_manifest }}
      dev_tools: ${{ steps.paths.outputs.dev_tools }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The pull request's merge commit and its first parent, the base.
          fetch-depth: 2
      - name: The path rules work
        run: tools/ci/test-changed-paths.sh
      - id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          # Merge groups: diff against the group's base commit.
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: tools/ci/changed-paths.sh

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      # Every first-party key in English and Polish, same placeholders,
      # complete plural forms, no unused keys (docs/i18n.md).
      - name: Translations
        run: pnpm --filter @deckpilot/desktop i18n:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # A hung test fails the job instead of holding it for the default 6 hours.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: tools/ci/install-linux-deps.sh
      # Installs the toolchain pinned in rust-toolchain.toml.
      - name: Install Rust toolchain
        run: rustup toolchain install && rustc --version && cargo clippy --version
      # rust-cache hashes every installed toolchain into its key; without
      # this, a runner whose image preinstalls a newer stable misses main's
      # cache (tools/ci/rust-pinned-toolchain.sh).
      - name: Only the pinned Rust toolchain
        shell: bash
        run: tools/ci/rust-pinned-toolchain.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # One cache per OS for the workspace, saved on main by this job;
          # the SQLCipher, credential store and manifest jobs restore it.
          shared-key: ci-workspace
          save-if: ${{ env.SAVE_RUST_CACHE == 'true' }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The desktop crate embeds the built frontend at compile time.
      - run: pnpm --filter @deckpilot/desktop build
      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Check that app, agent and frontend versions match
        if: runner.os == 'Linux'
        run: cargo run --locked -p deckpilot-dev -- check-versions
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
        timeout-minutes: 25
      # The registry publishing tool and its end-to-end tests sit behind the
      # crate's optional `publish` feature. `cargo test --workspace` above
      # already runs them on every OS (the agent's and the app's
      # dev-dependencies enable the feature); this runs the crate in its own
      # feature set, without the other members' features, once.
      - if: runner.os == 'Linux'
        run: cargo test -p deckpilot-plugin-registry --features publish --locked
      # The guided hardware test, run against a simulated MK.2 with the real
      # agent: checks the procedure (not hardware).
      - name: Hardware test procedure (simulated device)
        if: runner.os == 'Linux'
        run: cargo run --locked -p deckpilot-dev -- hardware-test --mock --dir "$RUNNER_TEMP/hardware-test"
      # The agent embeds an Info.plist so that code signing uses a fixed
      # identifier; its Keychain access across updates depends on it.
      - name: The agent keeps a fixed code signing identifier
        if: runner.os == 'macOS'
        run: |
          cp target/debug/deckpilot-agent "$RUNNER_TEMP/deckpilot-agent"
          codesign --force --sign - --options runtime "$RUNNER_TEMP/deckpilot-agent"
          codesign --display --verbose=2 "$RUNNER_TEMP/deckpilot-agent" 2>&1 \
            | grep -x "Identifier=io.github.knittingcode.deckpilot.agent"

  # The acceptance gate of the extraction (WP-T1, docs/marketplace/
  # module-migration.md §11): the core with every optional plugin switched
  # off, disabled and uninstalled, through the real agent, the real plugin
  # host and every first-party plugin built to wasm. Not a required check.
  core-without-plugins:
    name: Core without optional plugins
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux system dependencies
        run: tools/ci/install-linux-deps.sh
      # rust-toolchain.toml pins the compiler; the plugins need the wasm32
      # target.
      - name: Install Rust toolchain
        run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown
          rustc --version
      - name: Only the pinned Rust toolchain
        shell: bash
        run: tools/ci/rust-pinned-toolchain.sh
      # Restores main's workspace cache; never saves one of its own.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ci-workspace
          workspaces: |
            . -> target
            plugins/runtime -> target
          save-if: false
      # Built first so that compile time stays out of the test's timeouts
      # (the test builds them itself when they are missing).
      - name: Build the plugin host and every first-party plugin
        working-directory: plugins/runtime
        run: |
          cargo build --locked -p deckpilot-plugin-host --bin deckpilot-plugin-host
          cargo build --locked --target wasm32-unknown-unknown --profile guest \
            -p deckpilot-docker -p deckpilot-git -p deckpilot-github -p deckpilot-gitlab \
            -p deckpilot-jira -p deckpilot-notifications -p deckpilot-projects \
            -p deckpilot-workflows -p deckpilot-workspace
      - name: The core without optional plugins
        run: cargo test -p deckpilot-agent --features plugins,test-hooks --test core_without_plugins --locked -- --nocapture

  sqlcipher:
    name: Storage with SQLCipher
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs the toolchain pinned in rust-toolchain.toml.
      - name: Install Rust toolchain
        run: rustup toolchain install && rustc --version && cargo clippy --version
      # rust-cache hashes every installed toolchain into its key; without
      # this, a runner whose image preinstalls a newer stable misses main's
      # cache (tools/ci/rust-pinned-toolchain.sh).
      - name: Only the pinned Rust toolchain
        shell: bash
        run: tools/ci/rust-pinned-toolchain.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Restores the Rust job's cache for this OS; saves none of its own
          # (the repository cache is limited to 10 GB).
          shared-key: ci-workspace
          save-if: false
      - run: cargo test -p deckpilot-storage --features sqlcipher --locked

  # The real credential store of each platform, under throwaway service
  # names that the test creates and deletes (never DeckPilot's own).
  keystore:
    name: Credential store (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.keystore == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      DECKPILOT_TEST_SYSTEM_KEYSTORE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install && rustc --version
      # rust-cache hashes every installed toolchain into its key; without
      # this, a runner whose image preinstalls a newer stable misses main's
      # cache (tools/ci/rust-pinned-toolchain.sh).
      - name: Only the pinned Rust toolchain
        shell: bash
        run: tools/ci/rust-pinned-toolchain.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Restores the Rust job's cache for this OS; saves none of its own
          # (the repository cache is limited to 10 GB).
          shared-key: ci-workspace
          save-if: false
      - name: Secret Service (GNOME Keyring)
        if: runner.os == 'Linux'
        run: |
          timeout 600 sudo apt-get update -o Acquire::ForceIPv4=true
          timeout 600 sudo apt-get install -y --no-install-recommends -o Acquire::ForceIPv4=true gnome-keyring dbus
      # In a D-Bus session with an unlocked keyring that answers before the
      # tests start; see tools/ci/with-keyring.sh.
      - name: Test (Linux, in a D-Bus session with an unlocked keyring)
        if: runner.os == 'Linux'
        run: tools/ci/with-keyring.sh cargo test -p deckpilot-keystore --locked -- --nocapture
      - name: Test
        if: runner.os != 'Linux'
        run: cargo test -p deckpilot-keystore --locked -- --nocapture

  # The worktree maintenance and build cache scripts of tools/dev, with the
  # shells developers run them in: bash 3.2 (/bin/bash on macOS) and bash 5
  # (Linux). Optional, not a required check.
  dev-tools:
    name: Dev tooling scripts (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.dev_tools == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scripts pass shellcheck
        if: runner.os == 'Linux'
        run: shellcheck tools/dev/*.sh tools/dev/tests/*.sh
      - name: Worktree maintenance (throwaway repository)
        run: /bin/bash --version | head -n 1 && /bin/bash tools/dev/tests/worktree-maintenance.test.sh
      # Includes two concurrent builds of a tiny crate outside the
      # repository: in two slots they overlap, in one target dir they block.
      - name: Target directory slots
        env:
          CARGO_INCREMENTAL: "0"
        run: /bin/bash tools/dev/tests/target-slot.test.sh

  # The release assembles latest.json from per-build fragments; release.yml
  # only runs on a tag, so the assembly is tested here with fake packages
  # signed by a throwaway key. Nothing is published.
  release-manifest:
    name: Release manifest assembly
    needs: changes
    if: needs.changes.outputs.release_manifest == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux system dependencies
        run: tools/ci/install-linux-deps.sh
      - name: Install Rust toolchain
        run: rustup toolchain install
      # rust-cache hashes every installed toolchain into its key; without
      # this, a runner whose image preinstalls a newer stable misses main's
      # cache (tools/ci/rust-pinned-toolchain.sh).
      - name: Only the pinned Rust toolchain
        shell: bash
        run: tools/ci/rust-pinned-toolchain.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Restores the Rust job's cache for this OS; saves none of its own
          # (the repository cache is limited to 10 GB).
          shared-key: ci-workspace
          save-if: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Release scripts pass shellcheck
        run: shellcheck -x tools/ci/*.sh
      - name: Assemble and verify latest.json from fixture builds
        run: tools/ci/test-latest-json.sh "$RUNNER_TEMP/latest-json-test"
      # Pre-release handling of the Packaging workflow (no .rpm, MSI
      # version mapping), on fake packages.
      - name: Package checks for pre-release versions
        run: tools/ci/test-check-packages.sh "$RUNNER_TEMP/check-packages-test"
