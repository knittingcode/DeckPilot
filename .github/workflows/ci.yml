name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # A hung test fails the job instead of holding it for the default 6 hours.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: tools/ci/install-linux-deps.sh
      # Installs the toolchain pinned in rust-toolchain.toml.
      - name: Install Rust toolchain
        run: rustup toolchain install && rustc --version && cargo clippy --version
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The desktop crate embeds the built frontend at compile time.
      - run: pnpm --filter @deckpilot/desktop build
      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Check that app, agent and frontend versions match
        if: runner.os == 'Linux'
        run: cargo run --locked -p deckpilot-dev -- check-versions
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
        timeout-minutes: 25
      # The guided hardware test, run against a simulated MK.2 with the real
      # agent: checks the procedure (not hardware).
      - name: Hardware test procedure (simulated device)
        if: runner.os == 'Linux'
        run: cargo run --locked -p deckpilot-dev -- hardware-test --mock --dir "$RUNNER_TEMP/hardware-test"
      # The agent embeds an Info.plist so that code signing uses a fixed
      # identifier; its Keychain access across updates depends on it.
      - name: The agent keeps a fixed code signing identifier
        if: runner.os == 'macOS'
        run: |
          cp target/debug/deckpilot-agent "$RUNNER_TEMP/deckpilot-agent"
          codesign --force --sign - --options runtime "$RUNNER_TEMP/deckpilot-agent"
          codesign --display --verbose=2 "$RUNNER_TEMP/deckpilot-agent" 2>&1 \
            | grep -x "Identifier=io.github.knittingcode.deckpilot.agent"

  sqlcipher:
    name: Storage with SQLCipher
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Installs the toolchain pinned in rust-toolchain.toml.
      - name: Install Rust toolchain
        run: rustup toolchain install && rustc --version && cargo clippy --version
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p deckpilot-storage --features sqlcipher --locked

  # Builds the Linux .deb and .rpm with the release configuration (bundled
  # agent, udev rule) and their updater artifacts, signed with a throwaway
  # key, to catch packaging mistakes before a release. Nothing is published.
  package-linux:
    name: Package check (Linux .deb)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system dependencies
        run: tools/ci/install-linux-deps.sh
      - name: Install Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: package-linux
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Throwaway updater key (not the release key)
        run: tools/ci/throwaway-updater-key.sh
      - name: Build and stage the agent
        run: |
          cargo build --release --locked -p deckpilot-agent
          mkdir -p apps/desktop/src-tauri/binaries
          cp target/release/deckpilot-agent "apps/desktop/src-tauri/binaries/deckpilot-agent-$(rustc -vV | sed -n 's/^host: //p')"
      - name: Build the .deb and .rpm
        run: >
          pnpm --filter @deckpilot/desktop tauri build --bundles deb,rpm
          --config src-tauri/tauri.release.conf.json
          --config "$THROWAWAY_UPDATER_CONFIG"
      - name: Names, versions, app, agent, udev rule and updater signatures
        run: tools/ci/check-packages.sh linux

  # Builds the Windows installers with the release configuration, the way
  # the release workflow does (agent built in a bash step with Strawberry
  # Perl for OpenSSL), with updater signatures from a throwaway key, and
  # checks their contents. Not code-signed; nothing is published.
  package-windows:
    name: Package check (Windows installers)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        shell: bash
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: package-windows
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Use Strawberry Perl for OpenSSL
        shell: pwsh
        run: |
          "OPENSSL_SRC_PERL=C:\Strawberry\perl\bin\perl.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Throwaway updater key (not the release key)
        shell: bash
        run: tools/ci/throwaway-updater-key.sh
      - name: Build and stage the agent
        shell: bash
        run: |
          cargo build --release --locked -p deckpilot-agent
          mkdir -p apps/desktop/src-tauri/binaries
          cp target/release/deckpilot-agent.exe "apps/desktop/src-tauri/binaries/deckpilot-agent-$(rustc -vV | sed -n 's/^host: //p').exe"
      - name: Build the installers
        shell: bash
        run: >
          pnpm --filter @deckpilot/desktop tauri build --bundles nsis,msi
          --config src-tauri/tauri.release.conf.json
          --config "$THROWAWAY_UPDATER_CONFIG"
      - name: Extract the installers
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $nsis = "target/release/bundle/nsis/DeckPilot_${version}_x64-setup.exe"
          $msi = "target/release/bundle/msi/DeckPilot_${version}_x64_en-US.msi"
          foreach ($file in @($nsis, $msi)) {
            if (-not (Test-Path $file)) { Write-Error "expected $file"; exit 1 }
          }
          & 7z x -y "-o$env:RUNNER_TEMP\nsis" (Resolve-Path $nsis).Path | Out-Null
          $process = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @("/a", "`"$((Resolve-Path $msi).Path)`"", "/qn", "TARGETDIR=`"$env:RUNNER_TEMP\msi`"")
          if ($process.ExitCode -ne 0) { Write-Error "administrative MSI extraction failed: $($process.ExitCode)"; exit 1 }
      - name: Names, versions, app, agent and updater signatures
        shell: bash
        run: tools/ci/check-packages.sh windows "$RUNNER_TEMP"
