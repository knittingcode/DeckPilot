# Keychain continuity across an update between two Developer ID signed
# builds, with the default system-managed key (docs/release-validation.md).
#
# Two versions are built from this commit and signed with the release's
# Developer ID certificate — never notarized: no Apple submission. Updater
# artifacts are signed with a throwaway key generated in the job, and the
# update comes from a loopback endpoint on the runner: no release, nothing
# public. The agent keeps its key in a temporary keychain that exists only
# for this job.
#
# Manual runs only (`gh workflow run "Update continuity" --ref main`): the
# test builds the app (dependency installation, build scripts) in the job
# that holds the Developer ID certificate, so it never runs on pull
# requests, where any branch's dependencies would run next to it. No cache
# is restored, so nothing written by other workflows is reused. The
# certificate is passed only to the update test step.
name: Update continuity

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-continuity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  continuity:
    name: Keychain access after a signed update (macOS)
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Temporary keychain for the agent
        run: |
          keychain="$RUNNER_TEMP/continuity.keychain-db"
          security create-keychain -p "" "$keychain"
          security set-keychain-settings "$keychain"
          security unlock-keychain -p "" "$keychain"
          echo "TEST_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
      - name: Update between two signed versions with a system-managed key
        env:
          KEY_MODE: system
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
        run: tools/release-validation/update-test.sh "$RUNNER_TEMP/update-test"
      - name: Logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: update-continuity-logs
          path: |
            ${{ runner.temp }}/update-test/*.log
            ${{ runner.temp }}/update-test/data/logs/
          if-no-files-found: ignore
      - name: Remove the temporary keychain
        if: always()
        run: |
          [ -n "${TEST_KEYCHAIN:-}" ] && security delete-keychain "$TEST_KEYCHAIN" || true
