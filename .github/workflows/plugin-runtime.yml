# Plugin runtime foundation (plugins/runtime: ABI, permission broker,
# sandboxed plugin host, supervisor, plugin SDK) and the sample plugin in
# plugins/examples, which is a member of that workspace. A standalone Cargo
# workspace with its own lock file, not part of the DeckPilot build or of any
# release. Runs on
# all three platforms because the OS sandbox probes are per platform (the
# Linux and Windows evidence comes from here). Not a required check. No
# secrets, read-only token.
name: Plugin runtime

on:
  push:
    branches: [main]
    paths:
      - plugins/runtime/**
      - plugins/examples/**
      - plugins/schemas/**
      - rust-toolchain.toml
      - apps/desktop/src-tauri/entitlements/**
      - .github/workflows/plugin-runtime.yml
  pull_request:
    paths:
      - plugins/runtime/**
      - plugins/examples/**
      - plugins/schemas/**
      - rust-toolchain.toml
      - apps/desktop/src-tauri/entitlements/**
      - .github/workflows/plugin-runtime.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugin-runtime-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Plugin runtime (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
        working-directory: plugins/runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rust-toolchain.toml at the repository root pins the compiler; the
      # test guest needs the wasm32 target for it.
      - name: Install Rust toolchain
        run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown
          rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: plugins/runtime
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Kernel and sandbox facilities
        if: runner.os == 'Linux'
        run: |
          uname -a
          cat /sys/kernel/security/lsm || true
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Clippy (wasm guest crates)
        run: cargo clippy --locked -p deckpilot-plugin-guest -p deckpilot-test-guest -p deckpilot-plugin-sdk -p deckpilot-sdk-test-guest -p hello-weather -p hello-world -p developer-tools -p deckpilot-github -p deckpilot-gitlab -p deckpilot-notifications --target wasm32-unknown-unknown -- -D warnings
      - name: Test
        run: cargo test --locked --no-fail-fast -- --nocapture
      # The host as a Developer ID package signs it (hardened runtime): with
      # exactly plugin-host.entitlements guests run and the host's own
      # sandbox still denies files, network and exec
      # (docs/marketplace/distribution.md, "macOS: the plugin host's
      # entitlement"). Signed ad hoc, no Apple account. GitHub's runners do
      # not enforce the hardened runtime's executable-memory rule, so the
      # kill without the entitlement and with allow-jit is shown only on a
      # stock Mac; the script reports that here.
      - name: Hardened runtime with the plugin host's entitlement (macOS)
        if: runner.os == 'macOS'
        run: scripts/macos-hardened-runtime.sh
      # AppContainer network isolation is enforced by the Windows Filtering
      # Platform; show its state next to the probe results.
      - name: Windows firewall and AppContainer profiles
        if: always() && runner.os == 'Windows'
        env:
          # Git Bash would rewrite the /s and /f switches into paths.
          MSYS_NO_PATHCONV: "1"
        run: |
          netsh advfirewall show allprofiles state || true
          sc query mpssvc || true
          # Profiles the supervisor created and did not delete (expected: none).
          reg query 'HKCU\Software\Classes\Local Settings\Software\Microsoft\Windows\CurrentVersion\AppContainer\Mappings' /s /f DeckPilot.PluginHost || true
      - name: Sandbox probe output
        if: always()
        run: |
          cargo run --locked -q --bin deckpilot-sandbox-probe -- read_file "$PWD/Cargo.toml" exec /bin/sh || true

  # The example plugins (plugins/examples/hello-world, developer-tools) are
  # reproducible on one machine: two builds, each from an empty target
  # directory, must give byte-identical modules. Builds on different
  # operating systems are not byte-identical (a known finding); Ubuntu is
  # the reference platform (docs/marketplace/sdk/building.md). The hashes
  # are printed for comparison. No cache: both builds start from clean.
  reproducible:
    name: Reproducible example plugins (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown
          rustc --version
      - name: Build twice from clean and compare
        env:
          CARGO_INCREMENTAL: "0"
        run: |
          set -euo pipefail
          for run in a b; do
            plugins/examples/build.sh --target-dir "$RUNNER_TEMP/target-$run" \
              --out "$RUNNER_TEMP/out-$run" | tee "$RUNNER_TEMP/sha256-$run.txt"
          done
          echo "--- ${{ matrix.os }}: sha256 of the example modules"
          cat "$RUNNER_TEMP/sha256-a.txt"
          for module in hello_world developer_tools; do
            cmp "$RUNNER_TEMP/out-a/$module.wasm" "$RUNNER_TEMP/out-b/$module.wasm" ||
              { echo "::error::$module.wasm differs between two clean builds"; exit 1; }
          done
          diff "$RUNNER_TEMP/sha256-a.txt" "$RUNNER_TEMP/sha256-b.txt"
          echo "identical: two clean builds gave the same modules"
