# Full installer packaging with the release configuration: Linux .deb and
# .rpm, Windows NSIS and MSI, their updater artifacts signed with a throwaway
# key, and the assertions of tools/ci/check-packages.sh (names, versions,
# app, bundled agent, udev rule, updater signatures). Nothing is code-signed
# or published; no repository secret is used.
#
# Runs:
# - on pull requests, only when packaging-relevant paths change
#   (tools/ci/changed-paths.sh, group `packaging`); otherwise the jobs
#   report as skipped;
# - on pushes to main that change those paths, nightly, by hand
#   (workflow_dispatch), and when called by another workflow (workflow_call):
#   the release workflow calls it before drafting a release, so version tags
#   do not trigger it directly.
#
# Reusable: `uses: ./.github/workflows/packaging.yml`.
#   Inputs (both optional; derived from the version when not given):
#   - prerelease (boolean): a pre-release version (X.Y.Z-alpha.N etc.); no
#     .rpm is built or expected, as RPM does not allow "-" in versions;
#   - msi-version (string): the numeric version for the MSI (WiX accepts
#     only numbers), passed as bundle.windows.wix.version; see
#     tools/ci/msi-version.sh for the mapping.
#   Output `version`: the version whose packages were built and checked.
name: Packaging

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - apps/desktop/src-tauri/**
      - apps/agent/**
      - packaging/**
      - tools/ci/**
      - .github/workflows/packaging.yml
      - Cargo.lock
      - Cargo.toml
      - apps/desktop/package.json
  schedule:
    # Nightly, 03:17 UTC (off the hour, when runners are less busy).
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      prerelease:
        description: Pre-release version (no .rpm); derived from the version when unset
        type: boolean
        default: false
      msi-version:
        description: Numeric MSI version (WiX); derived from the version when empty
        type: string
        default: ""
  workflow_call:
    inputs:
      prerelease:
        description: Pre-release version (no .rpm); derived from the version when false
        type: boolean
        default: false
      msi-version:
        description: Numeric MSI version (bundle.windows.wix.version); derived from the version when empty
        type: string
        default: ""
    outputs:
      version:
        description: The version whose packages were built and checked
        value: ${{ jobs.package-linux.outputs.version }}

permissions:
  contents: read

# Pull requests: a new push cancels the obsolete run. Every other run (main,
# nightly, manual, called) has a group of its own and runs to the end.
# (In a called workflow, github.workflow and github.run_id are the caller's.)
concurrency:
  group: packaging-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Empty for events without inputs (pull requests, pushes, nightly).
  PRERELEASE_INPUT: ${{ inputs.prerelease && 'true' || 'false' }}
  MSI_VERSION_INPUT: ${{ inputs.msi-version }}
  RUST_CACHE_SAVE: ${{ github.ref == 'refs/heads/main' }}

jobs:
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    outputs:
      packaging: ${{ steps.paths.outputs.packaging }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: tools/ci/changed-paths.sh

  # Builds the Linux .deb and .rpm with the release configuration (bundled
  # agent, udev rule) and their updater artifacts, signed with a throwaway
  # key, to catch packaging mistakes before a release. Nothing is published.
  package-linux:
    name: Package check (Linux .deb)
    needs: changes
    if: needs.changes.outputs.packaging == 'true'
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system dependencies
        run: tools/ci/install-linux-deps.sh
      - name: Install Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: package-linux
          save-if: ${{ env.RUST_CACHE_SAVE == 'true' }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Throwaway updater key (not the release key)
        run: tools/ci/throwaway-updater-key.sh
      - name: Build and stage the agent
        run: |
          cargo build --release --locked -p deckpilot-agent
          mkdir -p apps/desktop/src-tauri/binaries
          cp target/release/deckpilot-agent "apps/desktop/src-tauri/binaries/deckpilot-agent-$(rustc -vV | sed -n 's/^host: //p')"
      # A pre-release version (input, or a "-" in the version) builds no
      # .rpm: RPM does not allow "-" in versions.
      - name: Pre-release or final version
        run: |
          version=$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)
          prerelease="$PRERELEASE_INPUT"
          case "$version" in *-*) prerelease=true ;; esac
          echo "PRERELEASE=$prerelease" >> "$GITHUB_ENV"
          echo "version $version, pre-release: $prerelease"
      - name: Build the .deb (and .rpm for final versions)
        run: >
          pnpm --filter @deckpilot/desktop tauri build
          --bundles "$([ "$PRERELEASE" = true ] && echo deb || echo deb,rpm)"
          --config src-tauri/tauri.release.conf.json
          --config "$THROWAWAY_UPDATER_CONFIG"
      - name: Names, versions, app, agent, udev rule and updater signatures
        run: tools/ci/check-packages.sh linux
      - name: Checked version
        id: version
        run: echo "version=$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)" >> "$GITHUB_OUTPUT"

  # Builds the Windows installers with the release configuration, the way
  # the release workflow does (agent built in a bash step with Strawberry
  # Perl for OpenSSL), with updater signatures from a throwaway key, and
  # checks their contents. Not code-signed; nothing is published.
  package-windows:
    name: Package check (Windows installers)
    needs: changes
    if: needs.changes.outputs.packaging == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        shell: bash
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: package-windows
          save-if: ${{ env.RUST_CACHE_SAVE == 'true' }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Use Strawberry Perl for OpenSSL
        shell: pwsh
        run: |
          "OPENSSL_SRC_PERL=C:\Strawberry\perl\bin\perl.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Throwaway updater key (not the release key)
        shell: bash
        run: tools/ci/throwaway-updater-key.sh
      - name: Build and stage the agent
        shell: bash
        run: |
          cargo build --release --locked -p deckpilot-agent
          mkdir -p apps/desktop/src-tauri/binaries
          cp target/release/deckpilot-agent.exe "apps/desktop/src-tauri/binaries/deckpilot-agent-$(rustc -vV | sed -n 's/^host: //p').exe"
      # WiX accepts only numeric versions: a pre-release gets the MSI
      # version from the input or tools/ci/msi-version.sh.
      - name: Pre-release or final version, MSI version
        shell: bash
        run: |
          version=$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)
          prerelease="$PRERELEASE_INPUT"
          case "$version" in *-*) prerelease=true ;; esac
          msi="${MSI_VERSION_INPUT:-$(tools/ci/msi-version.sh "$version")}"
          [[ "$msi" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] \
            || { echo "::error::msi-version '$msi' is not numeric (X.Y.Z or X.Y.Z.N)"; exit 1; }
          jq -n --arg v "$msi" '{bundle: {windows: {wix: {version: $v}}}}' > "$RUNNER_TEMP/msi-version.conf.json"
          { echo "PRERELEASE=$prerelease"; echo "MSI_CONFIG=$RUNNER_TEMP/msi-version.conf.json"; } >> "$GITHUB_ENV"
          echo "version $version, pre-release: $prerelease, MSI version: $msi"
      - name: Build the installers
        shell: bash
        run: >
          pnpm --filter @deckpilot/desktop tauri build --bundles nsis,msi
          --config src-tauri/tauri.release.conf.json
          --config "$THROWAWAY_UPDATER_CONFIG"
          --config "$MSI_CONFIG"
      - name: Extract the installers
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $nsis = "target/release/bundle/nsis/DeckPilot_${version}_x64-setup.exe"
          $msi = "target/release/bundle/msi/DeckPilot_${version}_x64_en-US.msi"
          foreach ($file in @($nsis, $msi)) {
            if (-not (Test-Path $file)) { Write-Error "expected $file"; exit 1 }
          }
          & 7z x -y "-o$env:RUNNER_TEMP\nsis" (Resolve-Path $nsis).Path | Out-Null
          $process = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @("/a", "`"$((Resolve-Path $msi).Path)`"", "/qn", "TARGETDIR=`"$env:RUNNER_TEMP\msi`"")
          if ($process.ExitCode -ne 0) { Write-Error "administrative MSI extraction failed: $($process.ExitCode)"; exit 1 }
      - name: Names, versions, app, agent and updater signatures
        shell: bash
        run: tools/ci/check-packages.sh windows "$RUNNER_TEMP"
