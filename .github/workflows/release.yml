# Builds signed installers and updater artifacts for a version tag and
# attaches them to a *draft* GitHub release. Nothing becomes visible to users
# or to the in-app updater until a maintainer publishes the draft.
#
# Required repository configuration (see docs/releasing.md):
#   secrets.TAURI_SIGNING_PRIVATE_KEY          updater signing key (minisign)
#   secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD its password
#   vars.DECKPILOT_UPDATER_PUBKEY              matching public key, compiled
#                                              into the app to verify updates
#
# macOS Developer ID signing and notarization (all required together):
#   secrets.APPLE_CERTIFICATE           base64 .p12: "Developer ID Application" certificate and key
#   secrets.APPLE_CERTIFICATE_PASSWORD  its password
#   vars.APPLE_SIGNING_IDENTITY         "Developer ID Application: Name (TEAMID)"
#   vars.APPLE_TEAM_ID                  the team identifier
#   secrets.APPLE_API_KEY               App Store Connect API private key (.p8 content or base64)
#   vars.APPLE_API_KEY_ID               its key ID
#   vars.APPLE_API_ISSUER               its issuer ID
# Without them the release is blocked, unless vars.DECKPILOT_ALLOW_UNSIGNED_MACOS
# is "true": unsigned macOS builds work, but macOS asks for the login keychain
# password after every update (see docs/security.md).
#
# Every job depends on the "validate-tag" job (directly or through another
# job's `needs`), which is the authoritative gate: the trigger's "v*" is only
# a preliminary filter. tools/release-pipeline/test.sh checks the dependency
# graph on every pull request that changes this file.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build, e.g. v0.6.0-alpha.1
        required: true

# Jobs that need more ask for it themselves.
permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  # The release gate (tools/release-pipeline/validate-tag.sh): the tag is
  # exactly vX.Y.Z or vX.Y.Z-(alpha|beta|rc).N, its commit (annotated tags
  # dereferenced) is on the protected main branch, every version matches it,
  # and the required checks passed on exactly that commit. Later jobs build
  # that commit (outputs.sha), not whatever the tag points to by then.
  validate-tag:
    name: Validate the release tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    outputs:
      version: ${{ steps.gate.outputs.version }}
      channel: ${{ steps.gate.outputs.channel }}
      sha: ${{ steps.gate.outputs.sha }}
      prerelease: ${{ steps.gate.outputs.prerelease }}
      msi_version: ${{ steps.gate.outputs.msi_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch the protected main branch
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
      - name: Install Rust toolchain
        run: rustup toolchain install
      - name: Tag, commit, versions and required checks
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: tools/release-pipeline/validate-tag.sh "$TAG"

  prepare:
    name: Check configuration and release notes
    needs: validate-tag
    runs-on: ubuntu-latest
    # Reads only; the release is created by the build jobs.
    permissions:
      contents: read
    outputs:
      macos-signing: ${{ steps.macos.outputs.signing }}
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-tag.outputs.sha }}
      - name: Install Rust toolchain
        run: rustup toolchain install
      - name: Signing configuration is present
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PUBKEY: ${{ vars.DECKPILOT_UPDATER_PUBKEY }}
        run: |
          test -n "$KEY" || { echo "::error::secret TAURI_SIGNING_PRIVATE_KEY is not configured"; exit 1; }
          test -n "$PUBKEY" || { echo "::error::variable DECKPILOT_UPDATER_PUBKEY is not configured"; exit 1; }
      - name: Updater public key is well formed
        env:
          DECKPILOT_UPDATER_PUBKEY: ${{ vars.DECKPILOT_UPDATER_PUBKEY }}
        run: cargo run --locked -p deckpilot-dev -- check-updater-key
      # The CHANGELOG.md section of the version becomes the release notes and
      # the notes of the in-app update; a release without notes is refused.
      - name: Release notes
        id: notes
        run: |
          notes=$(cargo run --locked -q -p deckpilot-dev -- release-notes)
          delimiter="notes-$(openssl rand -hex 8)"
          { echo "notes<<$delimiter"; echo "$notes"; echo "$delimiter"; } >> "$GITHUB_OUTPUT"
      - name: macOS signing configuration
        id: macos
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ vars.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ vars.APPLE_API_ISSUER }}
          ALLOW_UNSIGNED: ${{ vars.DECKPILOT_ALLOW_UNSIGNED_MACOS }}
        run: |
          missing=""
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_API_KEY_CONTENT APPLE_SIGNING_IDENTITY APPLE_TEAM_ID APPLE_API_KEY_ID APPLE_API_ISSUER; do
            test -n "${!name}" || missing="$missing $name"
          done
          if [ -z "$missing" ]; then
            case "$APPLE_SIGNING_IDENTITY" in
              "Developer ID Application: "*"($APPLE_TEAM_ID)") ;;
              *) echo "::error::APPLE_SIGNING_IDENTITY must be a 'Developer ID Application: … (APPLE_TEAM_ID)' identity"; exit 1 ;;
            esac
            echo "signing=true" >> "$GITHUB_OUTPUT"
          elif [ "$ALLOW_UNSIGNED" = "true" ]; then
            echo "::warning::macOS builds are NOT signed or notarized (missing:$missing). Gatekeeper warns, and macOS asks for the login keychain password after every update."
            echo "signing=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::macOS Developer ID signing is not configured (missing:$missing). Configure it, or set the variable DECKPILOT_ALLOW_UNSIGNED_MACOS to true to release unsigned macOS builds deliberately."
            exit 1
          fi

  build:
    name: Build (${{ matrix.target }})
    needs: [validate-tag, prepare]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      # Build provenance attestations for the release artifacts.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-tag.outputs.sha }}
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: tools/ci/install-linux-deps.sh
      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The vendored OpenSSL (SQLCipher) is configured with Perl. Bash steps
      # on Windows would find Git's minimal Perl, which lacks modules the
      # configure script needs; use the runner's Strawberry Perl.
      - name: Use Strawberry Perl for OpenSSL (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $perl = "C:\Strawberry\perl\bin\perl.exe"
          if (-not (Test-Path $perl)) { Write-Error "Strawberry Perl not found at $perl"; exit 1 }
          "OPENSSL_SRC_PERL=$perl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      # The agent ships inside the bundle as a Tauri external binary.
      - name: Build and stage the agent
        shell: bash
        run: |
          cargo build --release --locked -p deckpilot-agent --target ${{ matrix.target }}
          suffix=""; [ "${{ runner.os }}" = "Windows" ] && suffix=".exe"
          mkdir -p apps/desktop/src-tauri/binaries
          cp "target/${{ matrix.target }}/release/deckpilot-agent${suffix}" \
             "apps/desktop/src-tauri/binaries/deckpilot-agent-${{ matrix.target }}${suffix}"
      # The bundler checks the updater artifacts against the public key in
      # the configuration (empty in tauri.conf.json; the app compiles it in).
      # And the numeric MSI version: Windows Installer refuses
      # "0.6.0-alpha.1" (deckpilot-dev release-tag computes it; see
      # docs/releasing.md).
      - name: Updater public key and MSI version for the bundler
        shell: bash
        env:
          DECKPILOT_UPDATER_PUBKEY: ${{ vars.DECKPILOT_UPDATER_PUBKEY }}
          MSI_VERSION: ${{ needs.validate-tag.outputs.msi_version }}
        run: |
          jq -n --arg key "$DECKPILOT_UPDATER_PUBKEY" --arg msi "$MSI_VERSION" \
            '{plugins: {updater: {pubkey: $key}}, bundle: {windows: {wix: {version: $msi}}}}' \
            > apps/desktop/src-tauri/tauri.updater.conf.json
      # Developer ID signing (application and the bundled agent, with the
      # hardened runtime) and notarization by the Tauri bundler. A stable
      # signature keeps the agent's Keychain access across updates.
      # Enabled only now, right before the bundler needs them: the
      # certificate and its password are not in the environment of the
      # dependency installation (package lifecycle scripts) or of the agent
      # build.
      - name: Enable macOS signing and notarization
        if: runner.os == 'macOS' && needs.prepare.outputs.macos-signing == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_ID: ${{ vars.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ vars.APPLE_API_ISSUER }}
        run: |
          # The private key goes to a file (APPLE_API_KEY_PATH); the bundler
          # reads the key *ID* from APPLE_API_KEY. Delimited values: a
          # certificate may span several lines.
          .github/scripts/apple-api-key.sh
          export APPLE_API_KEY="$APPLE_API_KEY_ID"
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_KEY APPLE_API_ISSUER; do
            delimiter="value-$(openssl rand -hex 8)"
            { echo "$name<<$delimiter"; echo "${!name}"; echo "$delimiter"; } >> "$GITHUB_ENV"
          done
      - name: Build and upload the application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          DECKPILOT_UPDATER_PUBKEY: ${{ vars.DECKPILOT_UPDATER_PUBKEY }}
        with:
          projectPath: apps/desktop
          tagName: ${{ env.TAG }}
          releaseName: DeckPilot ${{ env.TAG }}
          releaseBody: ${{ needs.prepare.outputs.notes }}
          releaseDraft: true
          # alpha, beta and rc tags become pre-releases: even if published,
          # they never become "latest", the channel the app reads.
          prerelease: ${{ needs.validate-tag.outputs.prerelease == 'true' }}
          # latest.json is assembled once, after all builds, by the manifest
          # job: four jobs merging into it concurrently can lose entries.
          includeUpdaterJson: false
          # RPM does not allow "-" in versions: pre-releases build .deb and
          # AppImage on Linux; stable releases all three.
          args: >-
            --target ${{ matrix.target }} --config src-tauri/tauri.release.conf.json
            --config src-tauri/tauri.updater.conf.json
            ${{ (runner.os == 'Linux' && needs.validate-tag.outputs.prerelease == 'true') && '--bundles deb,appimage' || '' }}
      # Later steps need no certificate: remove it from their environment.
      - name: Disable macOS signing for the remaining steps
        if: runner.os == 'macOS' && needs.prepare.outputs.macos-signing == 'true'
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD; do
            echo "$name=" >> "$GITHUB_ENV"
          done
      # This build's entries of latest.json (target keys, asset names and
      # signatures), for the manifest job.
      - name: Updater manifest fragment
        shell: bash
        run: >
          tools/ci/updater-fragment.sh "${{ matrix.target }}"
          "target/${{ matrix.target }}/release/bundle"
          "$RUNNER_TEMP/updater-fragment/${{ matrix.target }}.json"
      - name: Upload the updater manifest fragment
        uses: actions/upload-artifact@v4
        with:
          name: updater-fragment-${{ matrix.target }}
          path: ${{ runner.temp }}/updater-fragment/${{ matrix.target }}.json
          if-no-files-found: error
          overwrite: true
      # The updater key compiled into the app must be the configured one;
      # otherwise installations could not verify (or would trust other) updates.
      - name: Embedded updater key matches DECKPILOT_UPDATER_PUBKEY
        shell: bash
        env:
          DECKPILOT_UPDATER_PUBKEY: ${{ vars.DECKPILOT_UPDATER_PUBKEY }}
        run: |
          suffix=""; [ "${{ runner.os }}" = "Windows" ] && suffix=".exe"
          binary="target/${{ matrix.target }}/release/deckpilot-desktop${suffix}"
          grep -q -F -a -- "$DECKPILOT_UPDATER_PUBKEY" "$binary" \
            || { echo "::error::$binary does not contain the configured updater public key"; exit 1; }
          echo "the configured updater public key is embedded in $binary"
      # The bundler notarizes and staples the app; the disk image is
      # notarized and stapled here and replaces the uploaded one.
      - name: Notarize and staple the disk image
        if: runner.os == 'macOS' && needs.prepare.outputs.macos-signing == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_API_KEY_ID: ${{ vars.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ vars.APPLE_API_ISSUER }}
        run: |
          dmg=$(find "target/${{ matrix.target }}/release/bundle/dmg" -maxdepth 1 -name '*.dmg' | head -n 1)
          .github/scripts/notarize.sh "$dmg"
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
          gh release upload "$TAG" "$dmg" --repo "$GITHUB_REPOSITORY" --clobber
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' \
            | grep -q -x -F "$(basename "$dmg")" \
            || { echo "::error::the stapled disk image did not replace the uploaded one"; exit 1; }
      - name: Verify macOS signatures, agent identity and notarization
        if: runner.os == 'macOS' && needs.prepare.outputs.macos-signing == 'true'
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          bundle="target/${{ matrix.target }}/release/bundle"
          app=$(find "$bundle/macos" -maxdepth 1 -name '*.app' | head -n 1)
          .github/scripts/verify-macos-app.sh "$app"
          # The updater installs the archived app: it must be the same signed,
          # notarized and stapled bundle.
          extracted="$RUNNER_TEMP/updater-app"
          rm -rf "$extracted" && mkdir -p "$extracted"
          tar -xzf "$(find "$bundle/macos" -maxdepth 1 -name '*.app.tar.gz' | head -n 1)" -C "$extracted"
          .github/scripts/verify-macos-app.sh "$(find "$extracted" -maxdepth 1 -name '*.app' | head -n 1)"
          # And the app inside the disk image.
          mount=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$(find "$bundle/dmg" -maxdepth 1 -name '*.dmg' | head -n 1)" >/dev/null
          .github/scripts/verify-macos-app.sh "$(find "$mount" -maxdepth 1 -name '*.app' | head -n 1)"
          hdiutil detach "$mount" >/dev/null
      - name: Note unsigned platform builds
        if: runner.os == 'Windows' || (runner.os == 'macOS' && needs.prepare.outputs.macos-signing != 'true')
        shell: bash
        run: |
          echo "### ${{ matrix.target }}: not code-signed" >> "$GITHUB_STEP_SUMMARY"
          echo "Installers carry no platform code signature (updater artifacts are signed). See docs/releasing.md." >> "$GITHUB_STEP_SUMMARY"
      # Signed statement that these files were built by this workflow from
      # this tag; verify with `gh attestation verify <file> --repo <owner/repo>`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            target/${{ matrix.target }}/release/bundle/**/*.dmg
            target/${{ matrix.target }}/release/bundle/**/*.app.tar.gz
            target/${{ matrix.target }}/release/bundle/**/*.AppImage
            target/${{ matrix.target }}/release/bundle/**/*.deb
            target/${{ matrix.target }}/release/bundle/**/*.rpm
            target/${{ matrix.target }}/release/bundle/**/*.msi
            target/${{ matrix.target }}/release/bundle/**/*.exe
            target/${{ matrix.target }}/release/bundle/**/*.sig

  # Writes latest.json once, from the fragments of all builds, and attaches
  # it to the draft. Fails if a platform or package type is missing, if two
  # builds claim the same entry, or if a referenced asset is not in the
  # draft (tools/ci/assemble-latest-json.sh, tested on every pull request by
  # tools/ci/test-latest-json.sh).
  manifest:
    name: Assemble latest.json
    needs: [validate-tag, prepare, build]
    runs-on: ubuntu-latest
    # Attaches latest.json to the draft.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-tag.outputs.sha }}
      - name: Download the updater manifest fragments
        uses: actions/download-artifact@v4
        with:
          pattern: updater-fragment-*
          merge-multiple: true
          path: ${{ runner.temp }}/updater-fragments
      - name: Assemble latest.json and attach it to the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: ${{ needs.prepare.outputs.notes }}
        run: |
          version=$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)
          printf '%s\n' "$NOTES" > "$RUNNER_TEMP/notes.md"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' \
            > "$RUNNER_TEMP/assets.txt"
          REPOSITORY="$GITHUB_REPOSITORY" VERSION="$version" NOTES_FILE="$RUNNER_TEMP/notes.md" \
            ASSETS_FILE="$RUNNER_TEMP/assets.txt" \
            tools/ci/assemble-latest-json.sh "$RUNNER_TEMP/updater-fragments" "$RUNNER_TEMP/latest.json"
          gh release upload "$TAG" "$RUNNER_TEMP/latest.json" --repo "$GITHUB_REPOSITORY" --clobber

  verify:
    name: Verify artifacts and publish checksums
    needs: [validate-tag, manifest]
    runs-on: ubuntu-latest
    # Attaches SHA256SUMS to the draft.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-tag.outputs.sha }}
      - name: Install Rust toolchain
        run: rustup toolchain install
      - name: Download the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir release-files
      - name: Verify manifest and signatures
        env:
          DECKPILOT_UPDATER_PUBKEY: ${{ vars.DECKPILOT_UPDATER_PUBKEY }}
        run: cargo run --locked -p deckpilot-dev -- verify-release release-files
      # Each build job merges its platforms into latest.json; a job that
      # failed to (or overwrote another's entry) would leave installations
      # of that platform or package type without updates, silently.
      - name: Every platform and package type is in latest.json
        env:
          PRERELEASE: ${{ needs.validate-tag.outputs.prerelease }}
        run: |
          required="darwin-aarch64 darwin-aarch64-app darwin-x86_64 darwin-x86_64-app
            linux-x86_64 linux-x86_64-appimage linux-x86_64-deb
            windows-x86_64 windows-x86_64-msi windows-x86_64-nsis"
          # Stable releases also build the .rpm (see the build job).
          [ "$PRERELEASE" = true ] || required="$required linux-x86_64-rpm"
          listed=$(jq -r '.platforms | keys[]' release-files/latest.json)
          echo "latest.json lists: $(tr '\n' ' ' <<< "$listed")"
          missing=""
          for target in $required; do
            echo "$listed" | grep -q -x -F "$target" || missing="$missing $target"
          done
          [ -z "$missing" ] || { echo "::error::latest.json has no update for:$missing"; exit 1; }
      - name: Attach checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd release-files
          rm -f SHA256SUMS
          sha256sum -- * > SHA256SUMS
          sha256sum --check SHA256SUMS
          gh release upload "$TAG" SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
