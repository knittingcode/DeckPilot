# Builds signed installers and updater artifacts for a version tag and
# attaches them to a *draft* GitHub release. Nothing becomes visible to users
# or to the in-app updater until a maintainer publishes the draft.
#
# Required repository configuration (see docs/releasing.md):
#   secrets.TAURI_SIGNING_PRIVATE_KEY          updater signing key (minisign)
#   secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD its password
#   vars.DECKPILOT_UPDATER_PUBKEY              matching public key, compiled
#                                              into the app to verify updates
#
# macOS Developer ID signing and notarization (all required together):
#   secrets.APPLE_CERTIFICATE                  base64 .p12 "Developer ID Application"
#   secrets.APPLE_CERTIFICATE_PASSWORD         its password
#   secrets.APPLE_SIGNING_IDENTITY             e.g. "Developer ID Application: Name (TEAMID)"
#   secrets.APPLE_ID, secrets.APPLE_PASSWORD   Apple ID and app-specific password
#   secrets.APPLE_TEAM_ID                      the team identifier
# Without them the release is blocked, unless vars.DECKPILOT_ALLOW_UNSIGNED_MACOS
# is "true": unsigned macOS builds work, but macOS asks for the login keychain
# password after every update (see docs/security.md).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build, e.g. v0.3.0
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  prepare:
    name: Check versions and configuration
    runs-on: ubuntu-latest
    outputs:
      macos-signing: ${{ steps.macos.outputs.signing }}
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Install Rust toolchain
        run: rustup toolchain install
      - name: Version of the tag, the app and the agent must match
        run: cargo run --locked -p deckpilot-dev -- check-versions --tag "$TAG"
      - name: Signing configuration is present
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PUBKEY: ${{ vars.DECKPILOT_UPDATER_PUBKEY }}
        run: |
          test -n "$KEY" || { echo "::error::secret TAURI_SIGNING_PRIVATE_KEY is not configured"; exit 1; }
          test -n "$PUBKEY" || { echo "::error::variable DECKPILOT_UPDATER_PUBKEY is not configured"; exit 1; }
      - name: Updater public key is well formed
        env:
          DECKPILOT_UPDATER_PUBKEY: ${{ vars.DECKPILOT_UPDATER_PUBKEY }}
        run: cargo run --locked -p deckpilot-dev -- check-updater-key
      # The CHANGELOG.md section of the version becomes the release notes and
      # the notes of the in-app update; a release without notes is refused.
      - name: Release notes
        id: notes
        run: |
          notes=$(cargo run --locked -q -p deckpilot-dev -- release-notes)
          delimiter="notes-$(openssl rand -hex 8)"
          { echo "notes<<$delimiter"; echo "$notes"; echo "$delimiter"; } >> "$GITHUB_OUTPUT"
      - name: macOS signing configuration
        id: macos
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ALLOW_UNSIGNED: ${{ vars.DECKPILOT_ALLOW_UNSIGNED_MACOS }}
        run: |
          missing=""
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            test -n "${!name}" || missing="$missing $name"
          done
          if [ -z "$missing" ]; then
            echo "signing=true" >> "$GITHUB_OUTPUT"
          elif [ "$ALLOW_UNSIGNED" = "true" ]; then
            echo "::warning::macOS builds are NOT signed or notarized (missing:$missing). Gatekeeper warns, and macOS asks for the login keychain password after every update."
            echo "signing=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::macOS Developer ID signing is not configured (missing:$missing). Configure it, or set the variable DECKPILOT_ALLOW_UNSIGNED_MACOS to true to release unsigned macOS builds deliberately."
            exit 1
          fi

  build:
    name: Build (${{ matrix.target }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      # Build provenance attestations for the release artifacts.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libudev-dev
      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      # Developer ID signing (application and the bundled agent, with the
      # hardened runtime) and notarization by the Tauri bundler. A stable
      # signature keeps the agent's Keychain access across updates.
      - name: Enable macOS signing and notarization
        if: runner.os == 'macOS' && needs.prepare.outputs.macos-signing == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Delimited values: a certificate may span several lines.
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            delimiter="value-$(openssl rand -hex 8)"
            { echo "$name<<$delimiter"; echo "${!name}"; echo "$delimiter"; } >> "$GITHUB_ENV"
          done
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The agent ships inside the bundle as a Tauri external binary.
      - name: Build and stage the agent
        shell: bash
        run: |
          cargo build --release --locked -p deckpilot-agent --target ${{ matrix.target }}
          suffix=""; [ "${{ runner.os }}" = "Windows" ] && suffix=".exe"
          mkdir -p apps/desktop/src-tauri/binaries
          cp "target/${{ matrix.target }}/release/deckpilot-agent${suffix}" \
             "apps/desktop/src-tauri/binaries/deckpilot-agent-${{ matrix.target }}${suffix}"
      # The bundler checks the updater artifacts against the public key in
      # the configuration (empty in tauri.conf.json; the app compiles it in).
      - name: Updater public key for the bundler
        shell: bash
        env:
          DECKPILOT_UPDATER_PUBKEY: ${{ vars.DECKPILOT_UPDATER_PUBKEY }}
        run: |
          jq -n --arg key "$DECKPILOT_UPDATER_PUBKEY" '{plugins: {updater: {pubkey: $key}}}' \
            > apps/desktop/src-tauri/tauri.updater.conf.json
      - name: Build and upload the application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          DECKPILOT_UPDATER_PUBKEY: ${{ vars.DECKPILOT_UPDATER_PUBKEY }}
        with:
          projectPath: apps/desktop
          tagName: ${{ env.TAG }}
          releaseName: DeckPilot ${{ env.TAG }}
          releaseBody: ${{ needs.prepare.outputs.notes }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: --target ${{ matrix.target }} --config src-tauri/tauri.release.conf.json --config src-tauri/tauri.updater.conf.json
      # The updater key compiled into the app must be the configured one;
      # otherwise installations could not verify (or would trust other) updates.
      - name: Embedded updater key matches DECKPILOT_UPDATER_PUBKEY
        shell: bash
        env:
          DECKPILOT_UPDATER_PUBKEY: ${{ vars.DECKPILOT_UPDATER_PUBKEY }}
        run: |
          suffix=""; [ "${{ runner.os }}" = "Windows" ] && suffix=".exe"
          binary="target/${{ matrix.target }}/release/deckpilot-desktop${suffix}"
          grep -q -F -a -- "$DECKPILOT_UPDATER_PUBKEY" "$binary" \
            || { echo "::error::$binary does not contain the configured updater public key"; exit 1; }
          echo "the configured updater public key is embedded in $binary"
      - name: Verify macOS signature, agent identity and notarization
        if: runner.os == 'macOS' && needs.prepare.outputs.macos-signing == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          app=$(find "target/${{ matrix.target }}/release/bundle/macos" -maxdepth 1 -name '*.app' | head -n 1)
          codesign --verify --deep --strict --verbose=2 "$app"
          # The agent keeps a stable identity (identifier and team) between
          # releases, so its Keychain item stays accessible after updates.
          details=$(codesign --display --verbose=2 "$app/Contents/MacOS/deckpilot-agent" 2>&1)
          echo "$details" | grep -E "^(Identifier|TeamIdentifier|Authority)="
          echo "$details" | grep -q "^TeamIdentifier=$APPLE_TEAM_ID$" || { echo "::error::the agent is not signed by the release team"; exit 1; }
          echo "$details" | grep -q "flags=.*runtime" || { echo "::error::the agent lacks the hardened runtime"; exit 1; }
          spctl --assess --type execute --verbose=2 "$app"
          xcrun stapler validate "$app"
      - name: Note unsigned platform builds
        if: runner.os == 'Windows' || (runner.os == 'macOS' && needs.prepare.outputs.macos-signing != 'true')
        shell: bash
        run: |
          echo "### ${{ matrix.target }}: not code-signed" >> "$GITHUB_STEP_SUMMARY"
          echo "Installers carry no platform code signature (updater artifacts are signed). See docs/releasing.md." >> "$GITHUB_STEP_SUMMARY"
      # Signed statement that these files were built by this workflow from
      # this tag; verify with `gh attestation verify <file> --repo <owner/repo>`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            target/${{ matrix.target }}/release/bundle/**/*.dmg
            target/${{ matrix.target }}/release/bundle/**/*.app.tar.gz
            target/${{ matrix.target }}/release/bundle/**/*.AppImage
            target/${{ matrix.target }}/release/bundle/**/*.deb
            target/${{ matrix.target }}/release/bundle/**/*.rpm
            target/${{ matrix.target }}/release/bundle/**/*.msi
            target/${{ matrix.target }}/release/bundle/**/*.exe
            target/${{ matrix.target }}/release/bundle/**/*.sig

  verify:
    name: Verify artifacts and publish checksums
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Install Rust toolchain
        run: rustup toolchain install
      - name: Download the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir release-files
      - name: Verify manifest and signatures
        env:
          DECKPILOT_UPDATER_PUBKEY: ${{ vars.DECKPILOT_UPDATER_PUBKEY }}
        run: cargo run --locked -p deckpilot-dev -- verify-release release-files
      - name: Attach checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd release-files
          rm -f SHA256SUMS
          sha256sum -- * > SHA256SUMS
          sha256sum --check SHA256SUMS
          gh release upload "$TAG" SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
