# The agent's experimental plugin backend (feature `plugins`, off in every
# release build): the dependency gate, clippy with the feature, and the
# end-to-end test through the real agent, the real sandboxed plugin host
# (built from plugins/runtime, a separate workspace) and the sample plugin,
# with a local registry signed by throwaway keys made in the test.
#
# Linux, macOS and Windows run the whole lifecycle; on Windows the
# supervisor launches the host in an AppContainer. On every OS the agent
# runs a plugin only in a host that reports a full sandbox, and the test
# checks that a host reporting a partial one is refused.
#
# Not a required check. No secrets, read-only token, no environment.
name: Plugins in the agent

on:
  push:
    branches: [main]
    paths:
      - apps/agent/**
      - crates/deckpilot-ipc/**
      - crates/deckpilot-net/**
      - crates/deckpilot-plugin-*/**
      - plugins/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/plugins-agent.yml
  pull_request:
    paths:
      - apps/agent/**
      - crates/deckpilot-ipc/**
      - crates/deckpilot-net/**
      - crates/deckpilot-plugin-*/**
      - plugins/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/plugins-agent.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugins-agent-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  e2e:
    name: Plugins in the agent (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: tools/ci/install-linux-deps.sh
      # rust-toolchain.toml pins the compiler; the sample plugin needs the
      # wasm32 target.
      - name: Install Rust toolchain
        run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown
          rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            . -> target
            plugins/runtime -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The vendored OpenSSL (SQLCipher) is configured with Perl. Bash steps
      # on Windows would find Git's minimal Perl, which lacks modules the
      # configure script needs; use the runner's Strawberry Perl.
      - name: Use Strawberry Perl for OpenSSL (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $perl = "C:\Strawberry\perl\bin\perl.exe"
          if (-not (Test-Path $perl)) { Write-Error "Strawberry Perl not found at $perl"; exit 1 }
          "OPENSSL_SRC_PERL=$perl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Release builds pull in no plugin crates
        run: cargo test -p deckpilot-agent --test plugins_feature --locked
      - name: Clippy with plugins
        run: cargo clippy -p deckpilot-agent --features plugins --all-targets --locked -- -D warnings
      # The test builds these itself when they are missing; building them
      # first keeps compile time out of the test's timeouts.
      # Diagnostic only: the kernel and the Landlock ABI it provides
      # (landlock_create_ruleset with LANDLOCK_CREATE_RULESET_VERSION). The
      # host reports `full` only with ABI 9, or ABI 8 with the seccomp
      # cover for ResolveUnix; below that `partial`, which the agent
      # refuses, so this explains a Linux failure at a glance.
      - name: Kernel and Landlock ABI (Linux)
        if: runner.os == 'Linux'
        run: |
          uname -a
          cat /sys/kernel/security/lsm || true
          python3 -c 'import ctypes; libc = ctypes.CDLL(None, use_errno=True); v = libc.syscall(444, None, 0, 1); print("landlock ABI:", v if v >= 0 else "error %d" % ctypes.get_errno())'
      - name: Build the plugin host
        working-directory: plugins/runtime
        run: cargo build --locked -p deckpilot-plugin-host --bin deckpilot-plugin-host
      - name: Build the example plugins and the SDK test guest
        working-directory: plugins/runtime
        run: cargo build --locked -p hello-weather -p hello-world -p developer-tools -p deckpilot-sdk-test-guest -p deckpilot-example-default -p deckpilot-legacy-fixture -p deckpilot-github --target wasm32-unknown-unknown --profile guest
      - name: Plugin unit tests (incl. the registry over HTTPS)
        run: "cargo test -p deckpilot-agent --features plugins --lib --locked plugins::"
      - name: End to end
        run: cargo test -p deckpilot-agent --features plugins --test plugins_e2e --locked -- --nocapture
      # Hello World and Developer Tools packaged from their directories,
      # installed, enabled and run; GitHub answers are canned.
      - name: Example plugins end to end
        run: cargo test -p deckpilot-agent --features plugins --test plugins_examples --locked -- --nocapture
      # A local TLS server with a throwaway CA only the agent under test
      # trusts; nothing reaches the network or the real registry.
      - name: End to end over HTTPS
        run: cargo test -p deckpilot-agent --features plugins --test plugins_registry_https --locked -- --nocapture
      # The test fixture bundled as an installed application ships it,
      # seeded offline, checked against its pins and run in the host.
      - name: Bundled plugins end to end
        run: cargo test -p deckpilot-agent --features plugins --test plugins_bundled --locked -- --nocapture
      # A built-in module moved to its migration-class bundled plugin: the
      # agent's fixture legacy module and the fixture plugin, consent,
      # restarts mid-migration, health check, retries, drift, the user's
      # disable and uninstall, and downgrades.
      - name: Module migration end to end
        run: cargo test -p deckpilot-agent --features plugins --test plugins_migration --locked -- --nocapture
      # deckpilot.github against the built-in github module on the same
      # canned GitHub answers: every action, the same results.
      - name: GitHub plugin parity end to end
        run: cargo test -p deckpilot-agent --features plugins --test plugins_github --locked -- --nocapture
      # The bundle layout as a release with DECKPILOT_RELEASE_PLUGINS=1
      # would build it, with the test fixture: built twice from clean
      # target directories (reproducible on this platform), the agent
      # compiled with the pins, and the release check against both. Last,
      # because it rebuilds the agent.
      - name: Bundle layout dry run
        run: |
          exe=""; [ "$RUNNER_OS" = Windows ] && exe=.exe
          # The release set: exactly the plugins of bundled.json, with their
          # classes. The fixture builds below contain it too, and are checked
          # against an agent compiled with their pins.
          plugins/first-party/build.sh --out "$RUNNER_TEMP/bundle-release"
          jq -c '[.plugins[] | {id, class}]' "$RUNNER_TEMP/bundle-release/bundled/pins.json" | tr -d '\r' > "$RUNNER_TEMP/release-set.json"
          echo '[{"id":"deckpilot.github","class":"migration"}]' | diff - "$RUNNER_TEMP/release-set.json"
          for run in a b; do
            plugins/first-party/build.sh --test-fixtures --out "$RUNNER_TEMP/bundle-$run" --target-dir "$RUNNER_TEMP/first-party-$run"
          done
          diff -r "$RUNNER_TEMP/bundle-a" "$RUNNER_TEMP/bundle-b"
          DECKPILOT_BUNDLED_PINS="$RUNNER_TEMP/bundle-a/bundled/pins.json" \
            cargo build --locked -p deckpilot-agent --features plugins --bin deckpilot-agent
          tools/release-pipeline/check-bundled-plugins.sh "$RUNNER_TEMP/bundle-a/bundled" "target/debug/deckpilot-agent$exe"
