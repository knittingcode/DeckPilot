# Proves that the configured updater signing key pair works, without
# building or publishing a release: a throwaway file is signed with the
# private key from the repository secrets and verified with the public key
# from the repository variable, using the same code the release workflow and
# the application use. No key material is printed; GitHub masks secrets.
name: Signing check

on:
  pull_request:
    paths:
      - .github/workflows/signing-check.yml
      - .github/workflows/release.yml
      - apps/desktop/src-tauri/tauri*.json
      - apps/desktop/src-tauri/src/updates.rs
      - crates/deckpilot-update/**
      - tools/dev/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signing:
    name: Updater signing keys match
    runs-on: ubuntu-latest
    # Secrets are not available to pull requests from forks.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: signing-check
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Public key is well formed
        env:
          DECKPILOT_UPDATER_PUBKEY: ${{ vars.DECKPILOT_UPDATER_PUBKEY }}
        run: cargo run --locked -p deckpilot-dev -- check-updater-key
      - name: Sign a throwaway file with the release key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "::error::secret TAURI_SIGNING_PRIVATE_KEY is not configured"; exit 1; }
          printf 'DeckPilot signing check %s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/signing-check.bin"
          pnpm --filter @deckpilot/desktop tauri signer sign "$RUNNER_TEMP/signing-check.bin" > /dev/null
          test -s "$RUNNER_TEMP/signing-check.bin.sig"
      - name: Signature verifies with the public key
        env:
          DECKPILOT_UPDATER_PUBKEY: ${{ vars.DECKPILOT_UPDATER_PUBKEY }}
        run: cargo run --locked -p deckpilot-dev -- verify-signature "$RUNNER_TEMP/signing-check.bin" "$RUNNER_TEMP/signing-check.bin.sig"
