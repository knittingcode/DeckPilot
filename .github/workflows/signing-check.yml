# The required check "Updater signing keys match", without any secret.
#
# - The updater public key pinned in .github/updater.pub is a well-formed
#   Ed25519 minisign key, and the repository variable
#   DECKPILOT_UPDATER_PUBKEY (compiled into release builds) is that key.
# - .github/scripts/updater-key-pair.py, which proves in the release
#   workflow that the real signing key and its password belong to the
#   pinned key, accepts and refuses committed throwaway keys
#   (.github/scripts/updater-key-pair-fixtures.sh).
#
# No secret is referenced here, so the job is the same for pull requests
# from this repository, from forks and from Dependabot, and it runs the
# pull request's own scripts. The real signing key meets
# updater-key-pair.py only in the release workflow's prepare job, in the
# protected production-release environment (tag v*, required reviewer).
# Developer ID and notarization credentials are checked by the Apple
# signing check workflow, in the same environment.
name: Signing check

on:
  # Every pull request: "Updater signing keys match" is a required check of
  # main, so it must report on every pull request, not only on changes to
  # release code.
  pull_request:
  # And every commit of main: the release gate requires it to have passed
  # on the exact tagged commit, and a squash merge is a new commit
  # (tools/release-pipeline/validate-tag.sh).
  push:
    branches: [main]
  # A merge queue group: "Updater signing keys match" must report for it.
  # Inert until the merge queue is enabled.
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signing:
    name: Updater signing keys match
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github
      - name: Pinned updater public key and throwaway key pairs
        env:
          DECKPILOT_UPDATER_PUBKEY: ${{ vars.DECKPILOT_UPDATER_PUBKEY }}
          # Pull requests from forks or Dependabot may not see repository
          # variables; when the variable is visible it must be the pinned
          # key, and on main and in merge queue groups it must be visible.
          DECKPILOT_UPDATER_PUBKEY_OPTIONAL: ${{ github.event_name == 'pull_request' }}
        run: .github/scripts/updater-key-pair-fixtures.sh
