[workspace]
resolver = "3"
members = [
    "crates/deckpilot-device",
    "crates/deckpilot-core",
    "crates/deckpilot-storage",
    "crates/deckpilot-hid",
    "crates/deckpilot-ipc",
    "crates/deckpilot-update",
    "crates/deckpilot-modules",
    "crates/deckpilot-portability",
    "crates/deckpilot-keystore",
    "crates/deckpilot-presence",
    "crates/deckpilot-render",
    "modules/general",
    "modules/projects",
    "modules/system",
    "modules/git",
    "modules/docker",
    "modules/http",
    "modules/notifications",
    "modules/github",
    "modules/gitlab",
    "modules/jira",
    "modules/workspace",
    "modules/work-session",
    "apps/agent",
    "apps/desktop/src-tauri",
    "tools/dev",
]

[workspace.package]
version = "0.6.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
repository = "https://github.com/knittingcode/DeckPilot"
publish = false

[workspace.dependencies]
deckpilot-device = { path = "crates/deckpilot-device" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
deckpilot-core = { path = "crates/deckpilot-core" }
deckpilot-storage = { path = "crates/deckpilot-storage" }
deckpilot-hid = { path = "crates/deckpilot-hid" }
deckpilot-ipc = { path = "crates/deckpilot-ipc" }
deckpilot-update = { path = "crates/deckpilot-update" }
deckpilot-modules = { path = "crates/deckpilot-modules" }
deckpilot-module-general = { path = "modules/general" }
deckpilot-module-projects = { path = "modules/projects" }
deckpilot-module-system = { path = "modules/system" }
deckpilot-module-git = { path = "modules/git" }
deckpilot-module-docker = { path = "modules/docker" }
deckpilot-module-http = { path = "modules/http" }
deckpilot-module-notifications = { path = "modules/notifications" }
deckpilot-module-github = { path = "modules/github" }
deckpilot-module-gitlab = { path = "modules/gitlab" }
deckpilot-module-jira = { path = "modules/jira" }
deckpilot-module-workspace = { path = "modules/workspace" }
deckpilot-module-work-session = { path = "modules/work-session" }
deckpilot-portability = { path = "crates/deckpilot-portability" }
deckpilot-keystore = { path = "crates/deckpilot-keystore" }
deckpilot-presence = { path = "crates/deckpilot-presence" }
deckpilot-render = { path = "crates/deckpilot-render" }

tauri = "2"
tauri-build = "2"
auto-launch = "0.6"
ctrlc = "3"
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
base64 = "0.22"
# `zeroize`: since 0.11 the cipher wipes its key on drop only with this
# feature (0.10 always did).
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "zeroize"] }
dirs = "7"
elgato-streamdeck = { version = "0.14", default-features = false }
font8x8 = { version = "0.3", default-features = false }
getrandom = "0.3"
hidapi = "2.6"
image = { version = "0.25", default-features = false }
minisign-verify = "0.3"
semver = { version = "1", features = ["serde"] }
interprocess = { version = "2.4", features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "signal"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "ansi"] }
tao = "0.37"
tray-icon = "0.25"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.38", default-features = false, features = ["system"] }
thiserror = "2"
url = "2.5"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
zeroize = { version = "1", features = ["derive", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"

# Password hashing (Argon2id) and the export cipher are far too slow without
# optimization; keep development builds and tests responsive.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.dev.package.chacha20poly1305]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
strip = true
