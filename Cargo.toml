[workspace]
resolver = "3"
members = [
    "crates/deckpilot-device",
    "crates/deckpilot-core",
    "crates/deckpilot-storage",
    "apps/desktop/src-tauri",

]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
repository = "https://github.com/knittingcode/DeckPilot"
publish = false

[workspace.dependencies]
deckpilot-device = { path = "crates/deckpilot-device" }
deckpilot-core = { path = "crates/deckpilot-core" }
deckpilot-storage = { path = "crates/deckpilot-storage" }

tauri = "2"
tauri-build = "2"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"

[profile.release]
codegen-units = 1
lto = true
strip = true
