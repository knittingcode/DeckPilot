[workspace]
resolver = "3"
members = [
    "crates/deckpilot-device",
    "crates/deckpilot-core",
    "crates/deckpilot-storage",
    "crates/deckpilot-hid",
    "crates/deckpilot-ipc",
    "apps/agent",
    "apps/desktop/src-tauri",

]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
repository = "https://github.com/knittingcode/DeckPilot"
publish = false

[workspace.dependencies]
deckpilot-device = { path = "crates/deckpilot-device" }
deckpilot-core = { path = "crates/deckpilot-core" }
deckpilot-storage = { path = "crates/deckpilot-storage" }
deckpilot-hid = { path = "crates/deckpilot-hid" }
deckpilot-ipc = { path = "crates/deckpilot-ipc" }

tauri = "2"
tauri-build = "2"
auto-launch = "0.6"
dirs = "7"
elgato-streamdeck = { version = "0.14", default-features = false }
font8x8 = { version = "0.3", default-features = false }
getrandom = "0.3"
hidapi = "2.6"
image = { version = "0.25", default-features = false }
interprocess = { version = "2.4", features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "signal"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "ansi"] }
tao = "0.37"
tray-icon = "0.25"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"

[profile.release]
codegen-units = 1
lto = true
strip = true
