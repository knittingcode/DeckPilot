[package]
name = "deckpilot-agent"
description = "DeckPilot background agent: device handling, actions, tray and IPC"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "deckpilot_agent"
path = "src/lib.rs"

[[bin]]
name = "deckpilot-agent"
path = "src/main.rs"

# Test only: a plugin host stand-in that reports a partial sandbox
# (`tests/plugins_e2e.rs`). Never built without `test-hooks`.
[[bin]]
name = "deckpilot-test-plugin-host"
path = "src/bin/deckpilot-test-plugin-host.rs"
required-features = ["plugins", "test-hooks"]

[features]
# Entry points of the work session for agent tests, until key gestures
# drive them. Never part of a release build: the configuration app has no
# way to start, verify or finish a session (decision D11). With `plugins`,
# also lets --plugin-registry-roots override embedded registry root keys in
# an optimized test build (deckpilot_plugin_registry::roots).
test-hooks = ["deckpilot-core/test-hooks", "deckpilot-plugin-registry?/test-hooks"]
# Experimental plugin marketplace backend (docs/marketplace/): the plugin
# store, registry client, package verification, supervisor and broker, and
# IPC protocol 10's plugin requests. Not a default feature: a build without
# it contains none of this (`tests/plugins_feature.rs` checks the
# dependency tree). In a build with it plugins are on unless the agent is started with
# `--disable-plugins` (or DECKPILOT_ENABLE_PLUGINS=0). Plugins run only
# in the separate, sandboxed `deckpilot-plugin-host` (plugins/runtime),
# never in the agent.
plugins = [
    "dep:base64",
    "dep:deckpilot-plugin-abi",
    "dep:deckpilot-plugin-bundled",
    "dep:deckpilot-plugin-broker",
    "dep:deckpilot-plugin-manifest",
    "dep:deckpilot-plugin-package",
    "dep:deckpilot-plugin-registry",
    "dep:deckpilot-plugin-store",
    "dep:deckpilot-plugin-supervisor",
    "dep:deckpilot-net",
    "dep:getrandom",
    "dep:hkdf",
    "dep:reqwest",
    "dep:rustls",
    "dep:serde",
    "dep:semver",
    "dep:sha2",
    "dep:url",
    "dep:zeroize",
]

[dependencies]
auto-launch.workspace = true
chrono.workspace = true
deckpilot-core.workspace = true
deckpilot-device = { workspace = true, features = ["mock"] }
# The build's distribution record: reported in `getStatus` and selecting
# the autostart strategy.
deckpilot-distribution.workspace = true
deckpilot-hid.workspace = true
deckpilot-ipc.workspace = true
deckpilot-modules.workspace = true
rusqlite.workspace = true
deckpilot-storage.workspace = true
deckpilot-keystore.workspace = true
deckpilot-presence.workspace = true
deckpilot-render.workspace = true
interprocess.workspace = true
serde_json.workspace = true
tao.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
tray-icon.workspace = true
# Feature `plugins` only.
# Installed plugin icons as data URLs (`PluginDetails.icon`).
base64 = { workspace = true, optional = true }
deckpilot-plugin-abi = { workspace = true, optional = true }
deckpilot-plugin-broker = { workspace = true, optional = true }
# The bundled first-party plugins: pins compiled in (DECKPILOT_BUNDLED_PINS
# at build time), verification, the macOS code seal.
deckpilot-plugin-bundled = { workspace = true, optional = true }
deckpilot-plugin-manifest = { workspace = true, optional = true }
deckpilot-plugin-package = { workspace = true, optional = true }
deckpilot-plugin-registry = { workspace = true, optional = true }
deckpilot-plugin-store = { workspace = true, optional = true }
deckpilot-plugin-supervisor = { workspace = true, optional = true }
# The core HTTP transport (address checks, pinned resolution, bounded
# bodies) carries out the fetches the broker allowed. Not a module crate,
# and already part of every agent build through the HTTP module.
deckpilot-net = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }
hkdf = { workspace = true, optional = true }
# deckpilot-net's request type names reqwest's methods. The registry's
# HTTPS source (plugins/fetch.rs) uses reqwest and rustls directly: the
# transport's stack and versions, already in every agent build.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
url = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
semver = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }

[dev-dependencies]
deckpilot-agent = { path = ".", features = ["test-hooks"] }
# plugins_e2e: a local signed registry made with the publishing tool and
# throwaway keys, packages, and reading plugins.db from outside.
base64.workspace = true
deckpilot-plugin-bundled.workspace = true
deckpilot-plugin-manifest.workspace = true
deckpilot-plugin-package.workspace = true
deckpilot-plugin-registry = { workspace = true, features = ["publish"] }
deckpilot-plugin-store.workspace = true
flate2.workspace = true
sha2.workspace = true
tar.workspace = true
tempfile.workspace = true
deckpilot-render.workspace = true
zeroize.workspace = true
deckpilot-modules.workspace = true
rusqlite.workspace = true
serde_json.workspace = true
# The registry's HTTPS tests: a local TLS server whose throwaway CA only
# the test trusts.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[lints]
workspace = true

# End to end through a real agent process, the real plugin host and the
# sample plugin (built from plugins/runtime by the test).
[[test]]
name = "plugins_e2e"
required-features = ["plugins"]

# Bundled first-party plugins: the test fixture built, staged as an
# installed application ships it, seeded offline and run through a real
# agent process and the real plugin host.
[[test]]
name = "plugins_bundled"
required-features = ["plugins"]

# Module migration: the fixture legacy module moved to its migration-class
# bundled plugin, through a real agent process and the real plugin host.
[[test]]
name = "plugins_migration"
required-features = ["plugins"]

# deckpilot.notifications, the first default-class bundled plugin:
# parity with the built-in, first launch, tombstones and upgrades, through
# a real agent process and the real plugin host.
[[test]]
name = "plugins_notifications"
required-features = ["plugins"]

# The registry over HTTPS (a local TLS server, a throwaway CA) through a
# real agent process and the real plugin host.
[[test]]
name = "plugins_registry_https"
required-features = ["plugins"]

# The example plugins (plugins/examples/hello-world, developer-tools)
# packaged, installed and run through a real agent process and the real
# plugin host, with canned HTTP.
[[test]]
name = "plugins_examples"
required-features = ["plugins"]
