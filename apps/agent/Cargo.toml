[package]
name = "deckpilot-agent"
description = "DeckPilot background agent: device handling, actions, tray and IPC"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "deckpilot_agent"
path = "src/lib.rs"

[[bin]]
name = "deckpilot-agent"
path = "src/main.rs"

[features]
# Entry points of the work session for agent tests, until key gestures
# drive them. Never part of a release build: the configuration app has no
# way to start, verify or finish a session (decision D11).
test-hooks = []

[dependencies]
auto-launch.workspace = true
chrono.workspace = true
deckpilot-core.workspace = true
deckpilot-device = { workspace = true, features = ["mock"] }
deckpilot-hid.workspace = true
deckpilot-ipc.workspace = true
deckpilot-modules.workspace = true
rusqlite.workspace = true
deckpilot-storage.workspace = true
deckpilot-keystore.workspace = true
deckpilot-presence.workspace = true
deckpilot-render.workspace = true
interprocess.workspace = true
serde_json.workspace = true
tao.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
tray-icon.workspace = true

[dev-dependencies]
deckpilot-agent = { path = ".", features = ["test-hooks"] }
deckpilot-render.workspace = true
zeroize.workspace = true
deckpilot-modules.workspace = true
rusqlite.workspace = true
serde_json.workspace = true

[lints]
workspace = true
