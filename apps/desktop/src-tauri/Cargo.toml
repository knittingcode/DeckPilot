[package]
name = "deckpilot-desktop"
description = "DeckPilot configuration application"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["self-update"]
# The app updates itself from GitHub Releases with the Tauri updater. Store
# builds (Mac App Store, MSIX, Flathub) are built without it
# (`--no-default-features`): they cannot download or install an update at
# all (docs/distribution/README.md, section 2.2, rule R1).
self-update = ["dep:tauri-plugin-updater"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
base64.workspace = true
deckpilot-core.workspace = true
deckpilot-device.workspace = true
deckpilot-ipc.workspace = true
deckpilot-modules.workspace = true
deckpilot-portability.workspace = true
deckpilot-presence.workspace = true
deckpilot-render.workspace = true
deckpilot-storage.workspace = true
deckpilot-update.workspace = true
# The build's compiled distribution record, which selects the update
# provider (docs/distribution/README.md, sections 2 and 3).
deckpilot-distribution.workspace = true
# The release list of the prerelease update channel, with the HTTP and TLS
# stack the updater plugin already uses (no further crates).
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true
tauri-plugin-dialog = "2"
# The Tauri updater of GitHub builds (feature `self-update`).
tauri-plugin-updater = { version = "2", optional = true }
thiserror.workspace = true
tokio.workspace = true

[dev-dependencies]
deckpilot-keystore.workspace = true
# The marketplace end-to-end tests (tests/support/marketplace.rs): a local
# registry signed with throwaway keys by the publishing tool, served over
# HTTPS with a throwaway CA (the agent's test server), and plugins.db read
# from outside.
deckpilot-plugin-manifest.workspace = true
deckpilot-plugin-registry = { workspace = true, features = ["publish"] }
deckpilot-plugin-store.workspace = true
hkdf.workspace = true
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha2.workspace = true
# The work session's test entry point stands in for its key (decision D11:
# the app itself has no way to operate a session).
deckpilot-agent = { path = "../../agent", features = ["test-hooks"] }
minisign = "0.10"
tauri = { workspace = true, features = ["test"] }

[lints]
workspace = true
